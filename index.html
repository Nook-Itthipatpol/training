/* v52: the group box is DERIVED from state.checks, never a stored value of its
   own — lit only when every exercise it covers is ticked. That is what lets a
   weight typed into one half of a pair (autoTick) and the group box itself stay
   in agreement without either being the master. */
function paintGroups(el){
  for(const b of el.querySelectorAll('[data-gcheck]')){
    const ids=b.dataset.gcheck.split(',').filter(Boolean);
    const on = ids.length>0 && ids.every(id=>state.checks[id]);
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  }
}
function markNext(el){
  let found=false;
  for(const g of el.querySelectorAll('.grp')){
    const open = !found && !!g.querySelector('.box:not(.on)');
    g.classList.toggle('now', open);
    const lab=g.querySelector('.sslab');
    /* v52: the group knows what it is from its own class now, instead of being
       inferred by counting checkboxes — which stopped working the moment a
       superset had only one box to count. */
    if(lab) lab.textContent = open ? 'up next' : (g.classList.contains('ss') ? 'superset' : '');
    if(open) found=true;
  }
}
function sync(i){
  const day=PLAN[i], el=daysEl.querySelector(`[data-day="${i}"]`);
  if(!el) return;
  const items=dayItems(day);
  const n=items.filter(it=>state.checks[it.id]).length;
  /* a weekend day offers alternatives — one of them IS the day, so `2 / 2` would
     be wrong and `1 / 2` would read as half-finished. */
  const total = day.anyOf ? 1 : items.length;
  const bar = el.querySelector(`[data-prog="${i}"]`);
  if(bar) bar.style.width = `${total ? Math.min(n,total)/total*100 : 0}%`;
  paintGroups(el);
  markNext(el);
  const stopped = !!(state.stopped && state.stopped[i]);
  el.classList.toggle('done', stopped || (day.anyOf ? n>=1 : n===items.length));
  paintProg();
}
/* v23: typing a number IS doing the exercise. The Routines tab already worked
   this way (setField); the week tab did not, so a logged weight with an unticked
   box was silently dropped at rollover — makeRecord only walks `checks`.
   Never auto-UNticks: clearing a mistyped number must not erase the set. */
function autoTick(el,id){
  if(state.checks[id]) return;
  state.checks[id]=true;
  const item=el.closest('.item'); if(!item) return;
  const box=item.querySelector('[data-check]');
  if(box){ box.classList.add('on'); box.setAttribute('aria-pressed','true'); }
  item.classList.add('on');
  const d=el.closest('[data-day]');
  if(d) sync(Number(d.dataset.day));
}
/* v39: the week bar is gone — at 0% it was a stray hairline above the first
   card, and the seven per-card rules already say the same thing louder.
   v51: weekProgress() went with it. The comment claimed the export blob and the
   deload copy still read it; neither did, and it had no callers at all. */
function paintProg(){}
function buildWeek(){
  daysEl.innerHTML=PLAN.map(dayHTML).join('');
  PLAN.forEach((_,i)=>sync(i));
  paintProg();
  /* v28: Wednesday has two sessions, so "today" can open more than one card */
  const td=dowOf(now());
  PLAN.forEach((s,i)=>{
    if(DOWI[s.dow]!==td) return;
    const el=daysEl.querySelector(`[data-day="${i}"]`);
    if(el){ el.classList.add('open'); el.querySelector('.head').setAttribute('aria-expanded','true'); }
  });
  /* v33: no week number, no date. The week is the only thing on screen, and
     history rows already carry their own week key. Deload is the one state the
     bar still has to announce, and the toggle beside it says it. */
  const wn=document.getElementById('weekno');
  wn.innerHTML = state.deload ? 'deload · numbers optional' : '';
  document.getElementById('weekbar').hidden = !state.deload;
  const tg=document.getElementById('dltoggle');
  tg.setAttribute('aria-pressed', state.deload?'true':'false');
  document.getElementById('dlintro').innerHTML =
    histWarnHTML() + (state.deload ? deloadIntroHTML() : '');
  buildBW();
}

/* v49: a silent history gap used to look identical to "no history yet" — the
   tables just came back short. Say which years did not load, and say whether the
   week is frozen because of it, so a stuck rollover is visible instead of felt. */
function histWarnHTML(){
  if(!histGaps.length) return '';
  const yrs=histGaps.slice().sort().join(', ');
  const frozen = !histOK
    ? ' <b>This week will not roll over until it reads.</b> Export your data before doing anything else.'
    : ' Older weeks are missing from the tables below; nothing new is at risk.';
  return `<p class="iomsg" style="margin:0 0 12px"><b>History incomplete</b> — could not read ${esc(yrs)}.${frozen}</p>`;
}

/* the live week in the same shape aeroList reads an archived one in */
function aeroNow(){
  /* v53: nothing to mirror any more — every aerobic session is logged on this
     tab. aeroList still reads the retired ids when it walks an ARCHIVED week, so
     old history keeps counting exactly as it did. */
  return aeroList({aero:state.aero});
}

/* ---- body weight · weekly ----
   Not a daily habit: one number a week, stored on the week record it belongs to.
   The delta is deliberately NOT coloured. Up is not failure and down is not
   success, and a tracker that grades the scale gets read as a verdict. */
const bwEl=document.getElementById('bwcard');
document.getElementById('bwver').textContent=APP_VERSION;
function bwLast(){ for(const r of histRecs){ if(r.bw!=null) return {w:r.bw,week:r.week}; } return null; }
/* v51: bwDeltaText() removed. It wrote into a [data-bwd] node that buildBW has
   not rendered for several versions, so the line never appeared. The same
   week-over-week difference is in the History table, uncoloured, which is where
   the reasoning in the header above wanted it anyway. */
function bwHistHTML(){
  const rows=[];
  for(const r of histRecs){ if(r.bw!=null) rows.push(r); if(rows.length>=8) break; }
  if(!rows.length) return '<p class="histcap">No history yet</p>';
  let h='<p class="histcap">Last 8 weeks</p><table class="h">';
  for(let i=0;i<rows.length;i++){
    const r=rows[i], prev=rows[i+1];
    const d=prev? +(r.bw-prev.bw).toFixed(1) : null;
    const txt=d==null?'':(d>0?`+${d}`:(d<0?`${d}`:'—'));
    h+=`<tr><td class="w">${r.week.slice(5)}</td><td class="kg">${r.bw} kg</td><td class="d">${txt}</td></tr>`;
  }
  return h+'</table>';
}
function buildBW(){
  const last=bwLast();
  bwEl.innerHTML=`<span class="bwlab">Body weight</span>
    <span class="wtwrap">
      <input class="wtin" id="bwin" type="number" step="0.1" inputmode="decimal"
             value="${esc(state.bw??'')}" placeholder="${last?esc(last.w):''}" aria-label="body weight">
      <span class="unit">kg</span>
    </span>
    <details><summary>History</summary><div class="histbody">${bwHistHTML()}</div></details>`;
}
bwEl.addEventListener('input',e=>{
  if(!e.target.closest('#bwin')) return;
  state.bw=e.target.value;
  save();
});
daysEl.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const el=daysEl.querySelector(`[data-day="${tg.dataset.toggle}"]`);
    tg.setAttribute('aria-expanded', el.classList.toggle('open')?'true':'false');
    return;
  }
  const dt=e.target.closest('[data-det]');
  if(dt){
    const item=dt.closest('.item');
    const on=item.classList.toggle('det');
    dt.setAttribute('aria-expanded',on?'true':'false');
    return;
  }
  /* independent of state.checks on purpose — a day cut short for recovery is
     not "every exercise done", so this never ticks or untangles a real box. */
  const sd=e.target.closest('[data-stopday]');
  if(sd){
    const i=Number(sd.dataset.stopday);
    state.stopped=state.stopped||{};
    const v=!state.stopped[i];
    state.stopped[i]=v;
    sd.classList.toggle('on',v);
    sd.setAttribute('aria-pressed',v?'true':'false');
    sd.closest('.item').classList.toggle('on',v);
    sync(i);
    save();
    return;
  }
  /* one press, every exercise in the pair — written individually, exactly as if
     each box had been tapped in turn. Full → clears the pair; anything else →
     completes it, so a half-done superset never needs two taps to finish. */
  const gb=e.target.closest('[data-gcheck]');
  if(gb){
    const ids=gb.dataset.gcheck.split(',').filter(Boolean);
    const v=!ids.every(id=>state.checks[id]);
    for(const id of ids){
      state.checks[id]=v;
      const item=daysEl.querySelector(`[data-item="${id}"]`);
      if(item) item.classList.toggle('on',v);
    }
    sync(Number(gb.closest('[data-day]').dataset.day));
    save();
    return;
  }
  const cb=e.target.closest('[data-check]');
  if(cb){
    const id=cb.dataset.check, v=!state.checks[id];
    state.checks[id]=v;
    cb.classList.toggle('on',v);
    cb.setAttribute('aria-pressed',v?'true':'false');
    cb.closest('.item').classList.toggle('on',v);
    sync(Number(cb.closest('[data-day]').dataset.day));
    save();
  }
});


/* v61: this listener was collateral damage. v60 deleted the dead [data-mt]
   branch by cutting from the top of the listener that contained it — but
   [data-wt] shared that listener and went with it, so every weight typed after
   v60 was held in the input and never written to state. Restored on its own.
   The lesson is in the shape of the bug: a listener that handles two unrelated
   things is one delete away from silently losing the other. */
daysEl.addEventListener('input',e=>{
  const w=e.target.closest('[data-wt]');
  if(!w) return;
  state.weights[w.dataset.wt]=w.value;
  if(w.value!=='') autoTick(w,w.dataset.wt);
  save();
});

/* v49: "clear checks" removed. It was labelled as a checkbox reset but also
   wiped state.aero — a whole week of logged sessions — and left weights and
   metrics behind, so the week afterwards held numbers that makeRecord would
   silently drop at rollover. Nothing here needed a bulk eraser: a wrong tick is
   one tap to undo, and a wrong week rolls off by itself. */
/* ================= transfer =================
   Everything here avoids three APIs that a sandboxed artifact iframe blocks
   without a word: file downloads, the file picker, and window.alert/confirm.
   v26 used all three, which is why the button looked broken — the handler ran
   fine and then nothing happened. Text in a textarea always works. */
const ioEl=document.getElementById('io');
const expBtn=document.getElementById('export');
const impBtn=document.getElementById('import');
let ioMode=null;

function ioMsg(html){ const el=ioEl.querySelector('[data-iomsg]'); if(el) el.innerHTML=html; }
function ioClose(){
  ioMode=null; ioEl.hidden=true; ioEl.innerHTML='';
  expBtn.setAttribute('aria-expanded','false');
  impBtn.setAttribute('aria-expanded','false');
}
function ioOpen(mode,title,body){
  ioMode=mode; ioEl.hidden=false;
  ioEl.innerHTML=`<div class="iohead"><span class="eyebrow">${title}</span>
    <button class="link" data-ioclose type="button">Close</button></div>${body}`;
  expBtn.setAttribute('aria-expanded', mode==='export'?'true':'false');
  impBtn.setAttribute('aria-expanded', mode==='import'?'true':'false');
  try{ ioEl.scrollIntoView({block:'nearest'}); }catch(e){}
}

async function buildDump(){
  const dump={exported:new Date().toISOString(),app:'training-week-v52',current:state,history:{},daily:{}};
  const idx=await store.get(HIDX);
  for(const y of ((idx&&idx.years)||[])){ const sh=await store.get(HSHARD(y)); if(sh) dump.history[y]=sh; }
  const d=now();
  /* v62 FIX: 24 DISTINCT months. The old walk used setMonth on today's date, so
     from the 31st it produced 14 unique keys and repeated the rest — an export
     that quietly left months out of the user's only backup. */
  for(let i=0;i<24;i++){
    const mk=monthKeyBack(d,i), sh=await store.get(DSHARD(mk));
    if(sh) dump.daily[mk]=sh;
  }
  return dump;
}
function countWeeks(dump){
  let n=0; for(const y of Object.keys(dump.history||{})) n+=Object.keys(dump.history[y].weeks||{}).length;
  return n;
}
function countDays(dump){
  let n=0; for(const mk of Object.keys(dump.daily||{})) n+=Object.keys(dump.daily[mk].days||{}).length;
  return n;
}

expBtn.addEventListener('click',async()=>{
  if(ioMode==='export') return ioClose();
  ioOpen('export','Export','<p class="iomsg" data-iomsg>Collecting…</p>');
  let dump;
  try{ dump=await buildDump(); }
  catch(err){ ioMsg('Could not read the data. Try again.'); return; }
  const txt=JSON.stringify(dump);
  ioOpen('export','Export',
    `<textarea class="iota" id="ioout" readonly>${esc(txt)}</textarea>
     <div class="iorow">
       <button class="btn" data-iocopy type="button">Copy all</button>
       <button class="btn ghost" data-iodl type="button">Try download</button>
     </div>
     <p class="iomsg" data-iomsg><b>${countWeeks(dump)}</b> weeks · <b>${countDays(dump)}</b> days · ${(txt.length/1024).toFixed(1)} KB<br>Copy, paste into Notes, then open the new version and paste it back into import</p>`);
});

impBtn.addEventListener('click',()=>{
  if(ioMode==='import') return ioClose();
  ioOpen('import','Import',
    `<textarea class="iota" id="ioin" placeholder="paste the copied JSON here" autocomplete="off" spellcheck="false"></textarea>
     <div class="iorow"><button class="btn" data-iocheck type="button">Check</button></div>
     <p class="iomsg" data-iomsg>History and the daily log are <b>merged</b>; nothing existing is dropped. The current week is overwritten.</p>`);
  const ta=ioEl.querySelector('#ioin'); if(ta) ta.focus();
});

/* plain-text exercise names, grouped by day — for pasting into notes/search.
   Resistance names come from PLAN, not tracked state, so they always list the
   plan as written, deload or not. Aerobic lines come from state.aero instead —
   there is no "aerobic plan" to fall back on, only whatever was actually
   logged for the live week, dose and all — so this half of the list changes
   as the week is filled in, unlike the resistance half. */
function aeroLineText(e){
  const cfg=AEROT[e.t]; if(!cfg) return null;
  const parts=cfg.fields.map(x=>{
    const v = (e.t==='x4' && x.k==='sets') ? x4Sets(e) : num(e[x.k]);
    return v==null ? null : `${v} ${x.unit}`;
  }).filter(Boolean);
  return parts.length ? `${cfg.label} — ${parts.join(' · ')}` : cfg.label;
}
function planListText(){
  const byDay=Array.from({length:7},()=>({names:[],aero:[]}));
  for(const day of PLAN){
    const names=day.items.filter(it=>it.name!=='Warm-up').map(it=>it.name);
    byDay[DOWI[day.dow]].names.push(...names);
  }
  for(const e of (state.aero||[])){
    const line=aeroLineText(e); if(!line) continue;
    byDay[e.d??0].aero.push(line);
  }
  return byDay
    .map((b,i)=>({i,lines:[...b.names,...b.aero]}))
    .filter(b=>b.lines.length)
    .map(b=>`${DOW_FULL[b.i]}\n${b.lines.join('\n')}`)
    .join('\n\n');
}
const copyListBtn=document.getElementById('copylist');
let copyListTimer=null;
copyListBtn.addEventListener('click',async()=>{
  const txt=planListText();
  let done=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); done=true; } }catch(err){}
  if(!done){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      done=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(err){}
  }
  clearTimeout(copyListTimer);
  copyListBtn.textContent = done ? 'copied' : 'copy failed';
  copyListTimer=setTimeout(()=>{ copyListBtn.textContent='copy exercise list'; },1500);
});

let pending=null;                      /* a parsed dump waiting for the second press */

async function runImport(dump){
  const years=new Set();
  for(const y of Object.keys(dump.history||{})){
    const inc=dump.history[y];
    if(!inc||!inc.weeks) continue;
    const cur=(await store.get(HSHARD(y)))||{v:1,weeks:{}};
    cur.weeks=cur.weeks||{};
    for(const wk of Object.keys(inc.weeks)) if(!cur.weeks[wk]) cur.weeks[wk]=inc.weeks[wk];
    if(!(await store.set(HSHARD(y),cur))) throw new Error('write '+y);
    years.add(Number(y));
  }
  if(years.size){
    const idx=(await store.get(HIDX))||{years:[]};
    /* v62 FIX: coerce, then sort NUMERICALLY.
       The old line merged whatever was on disk with the new years and sorted with
       the default comparator, which is lexicographic. A Set also treats '2026'
       and 2026 as two members, so an index that already held a string kept both
       — and both mapped to the same shard key, which is how loadHist ended up
       reading one year twice. Normalise on the way in and the duplicate can
       never be written in the first place. */
    const old=(Array.isArray(idx.years)?idx.years:[]).map(Number).filter(Number.isFinite);
    const merged=new Set([...old,...years]);
    await store.set(HIDX,{years:[...merged].sort((a,b)=>a-b)});
  }
  for(const mk of Object.keys(dump.daily||{})){
    const inc=dump.daily[mk];
    if(!inc||!inc.days) continue;
    const cur=(await store.get(DSHARD(mk)))||{v:1,days:{}};
    cur.days=cur.days||{};
    for(const dk of Object.keys(inc.days)) if(!cur.days[dk]) cur.days[dk]=inc.days[dk];
    await store.set(DSHARD(mk),cur);
  }
  if(dump.current){ applyState(dump.current); await store.set(KEY,state); }
  await loadHist();
  await rollIfStale();
  dailyReady=null;                     /* next mount re-reads the month shards */
  buildWeek();
  buildAero();
  if(curTab==='daily') await mountDaily();
}

ioEl.addEventListener('click',async e=>{
  if(e.target.closest('[data-ioclose]')) return ioClose();

  if(e.target.closest('[data-iocopy]')){
    const ta=ioEl.querySelector('#ioout'); if(!ta) return;
    ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
    let done=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(ta.value); done=true; } }catch(err){}
    if(!done){ try{ done=document.execCommand('copy'); }catch(err){} }
    ioMsg(done ? '<b>Copied</b> — paste it somewhere safe before opening a new version'
               : 'Auto-copy blocked — <b>the text is already selected</b>, long-press and choose Copy');
    return;
  }

  if(e.target.closest('[data-iodl]')){
    /* still offered: it works when the artifact is opened in its own tab */
    const ta=ioEl.querySelector('#ioout'); if(!ta) return;
    try{
      const blob=new Blob([ta.value],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`training-export-${dayKeyOf(now())}.json`;
      a.rel='noopener'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      ioMsg('If no file appears, downloads are blocked here — use Copy all instead');
    }catch(err){ ioMsg('Download is blocked here — use Copy all instead'); }
    return;
  }

  if(e.target.closest('[data-iocheck]')){
    const ta=ioEl.querySelector('#ioin'); if(!ta) return;
    const raw=(ta.value||'').trim();
    if(!raw){ ioMsg('Nothing added'); return; }
    let dump=null;
    try{ dump=JSON.parse(raw); }catch(err){ ioMsg('Not readable — the pasted text is not complete JSON (partial copy?)'); return; }
    if(!dump||typeof dump!=='object'||!String(dump.app||'').startsWith('training-')){
      ioMsg('This is not an export from this app'); return;
    }
    pending=dump;
    const btn=ioEl.querySelector('[data-iocheck]');
    btn.outerHTML='<button class="btn warn" data-iogo type="button">Confirm import</button>';
    ioMsg(`Found <b>${countWeeks(dump)}</b> weeks · <b>${countDays(dump)}</b> days · exported ${esc(String(dump.exported||'').slice(0,10))}<br>Confirm to merge into your current data.`);
    return;
  }

  if(e.target.closest('[data-iogo]')){
    if(!pending) return;
    ioMsg('Importing…');
    try{
      await runImport(pending);
      const n=countWeeks(pending);
      pending=null;
      ioEl.innerHTML=`<div class="iohead"><span class="eyebrow">Import</span>
        <button class="link" data-ioclose type="button">Close</button></div>
        <p class="iomsg" data-iomsg><b>Imported</b> · ${n} weeks</p>`;
      /* the panel is now a receipt, not a form: release the toggle so pressing
         import again opens a fresh paste box instead of closing the receipt */
      ioMode=null;
      impBtn.setAttribute('aria-expanded','false');
    }catch(err){
      /* v49: the old copy claimed nothing had been touched, which is not true
         once the first shard has been written. Every merge here is additive and
         never overwrites an existing week or day, so a partial import is safe to
         re-run — that, not a false all-or-nothing promise, is what to tell the user. */
      ioMsg('Import stopped partway — <b>nothing existing was overwritten</b>, but some weeks may not have arrived. Tap <b>Confirm import</b> again to finish.');
    }
    return;
  }
});

/* ================= daily tab ================= */
const habEl=document.getElementById('habits');
function weekDayKeys(){
  const start=new Date(weekStartOf(now())+'T12:00:00');
  return Array.from({length:7},(_,i)=>{
    const d=new Date(start.getTime()); d.setDate(d.getDate()+i);
    return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  });
}
function buildDaily(){
  const keys=weekDayKeys(), td=dowOf(now());
  habEl.innerHTML=DAILY.map(h=>{
    const cells=keys.map((k,i)=>{
      const on=(dayLog[k]||{})[h.id]?' on':'';
      const cls=i===td?' today':(i>td?' future':'');
      return `<div class="gcell${cls}"><span class="gdow">${DOW_TH[i]}</span>
        <button class="gbox${on}" data-hab="${h.id}" data-day="${k}" aria-pressed="${on?'true':'false'}"
          aria-label="${esc(h.name)} ${DOW_TH[i]}">${CHECK}</button></div>`;
    }).join('');
    /* v54: name, grid, today's fields, density. The dose line, the streak and the
       Detail disclosure are gone — a daily habit is read as ticked-or-not, and
       three lines of text around every card was the tab's whole scroll. */
    return `<section class="hab">
      <div class="habtop">
        <span class="habname">${esc(h.name)}</span>
        <span class="density">${densityOf(dayLog,h.id,now(),30)} / 30</span>
      </div>
      <div class="grid">${cells}</div>
      ${fieldRow(h)}
    </section>`;
  }).join('');
  document.getElementById('dailyno').innerHTML='';
}
/* v21: numbers are edited for TODAY only, below the grid.
   Putting an editor behind every cell would turn a one-tap habit tracker into a
   two-step one for all seven days × every habit. A habit log that gets more
   expensive per tap is a habit log that stops being filled in. */
function fieldRow(h){
  if(!h.fields) return '';
  const k=dayKeyOf(now()), row=dayLog[k]||{}, cur=(typeof row[h.id]==='object')?row[h.id]:{};
  const inputs=h.fields.map(f=>{
    if(f.type==='score'){
      const btns=Array.from({length:f.max},(_,i)=>{
        const v=i+1, on=cur[f.k]===v?' on':'';
        return `<button class="sc${on}" data-score="${h.id}" data-fk="${f.k}" data-v="${v}"
                  aria-pressed="${on?'true':'false'}">${v}</button>`;
      }).join('');
      /* v62: a <label> with no form control inside it, wrapping buttons. Clicking
         a button inside a label fires the label's own activation behaviour too,
         which is a second click waiting to happen; and the row is a group of
         controls, not a caption for one. A div with the same class styles
         identically. */
      return `<div class="mt" role="group" aria-label="${esc(f.label)} ${esc(h.name)}">
        <span class="mtlab">${esc(f.label)}</span>
        <span class="scoreset">${btns}</span></div>`;
    }
    return `<label class="mt"><span class="mtlab">${esc(f.label)}</span>
      <span class="mtbox">
        <input class="wtin mtin" type="number" step="${f.step}" inputmode="decimal"
               data-hf="${h.id}" data-fk="${f.k}" value="${esc(cur[f.k]??'')}"
               aria-label="${esc(f.label)} ${esc(h.name)}">
        <span class="unit">${esc(f.unit)}</span>
      </span></label>`;
  }).join('');
  return `<div class="todayrow"><span class="todaylab">Today</span>${inputs}</div>`;
}
/* write one field onto today's row. Entering a number IS doing the habit, so it
   ticks the box too — otherwise "15 min, unticked" is a state that means nothing. */
function applyField(id,k,v){
  const day=dayKeyOf(now());
  const row=dayLog[day]||(dayLog[day]={});
  const had=row[id];
  const cur=(typeof had==='object')?had:{v:1};
  if(v==null) delete cur[k]; else cur[k]=v;
  const rest=Object.keys(cur).filter(x=>x!=='v');
  if(rest.length)   row[id]=cur;   /* has numbers → object */
  else if(had)      row[id]=1;     /* was already ticked → stays a plain tick */
  else              delete row[id];/* typed then cleared, never ticked → nothing happened */
  return day;
}
/* v35: the write is fire-and-forget. Tapping a quality number used to await a
   storage round trip before the button could light up, which on a slow write
   read as a dead control. The state is already correct in memory; persisting
   it is not something the finger should have to wait for. */
function setField(id,k,v){ saveDaily(applyField(id,k,v)); }
habEl.addEventListener('click',e=>{
  const s=e.target.closest('[data-score]');
  if(s){
    const id=s.dataset.score, k=s.dataset.fk, v=Number(s.dataset.v);
    const day=dayKeyOf(now()), cur=(dayLog[day]||{})[id];
    const had=(typeof cur==='object')&&cur[k]===v;
    const dk=applyField(id,k,had?null:v);   /* tapping the lit number clears it */
    buildDaily();
    saveDaily(dk);
    return;
  }
  const b=e.target.closest('[data-hab]');
  if(!b) return;
  const id=b.dataset.hab, day=b.dataset.day;
  dayLog[day]=dayLog[day]||{};
  if(dayLog[day][id]) delete dayLog[day][id]; else dayLog[day][id]=1;
  buildDaily();
  saveDaily(day);
});
/* v50: one timer per field, not one for the whole tab. A single shared timer
   meant typing in Meditation's minutes and then moving to another number inside
   300ms cancelled the first field's pending write and lost it — the value sat on
   screen and was never stored. Keyed by habit+field, so two fields debounce
   independently and neither can cancel the other. */
const habTimers={};
/* v62: the same pending write, reachable by flushWrites when the tab goes away
   before the 300ms is up. One entry per field, cleared as soon as it has run. */
const habFlush={};
habEl.addEventListener('input',e=>{
  const f=e.target.closest('[data-hf]');
  if(!f) return;
  const id=f.dataset.hf, k=f.dataset.fk, raw=f.value;
  const tk=id+':'+k;
  clearTimeout(habTimers[tk]);
  const run=()=>{
    delete habTimers[tk]; delete habFlush[tk];
    setField(id,k, raw===''?null:Number(raw));
    const box=habEl.querySelector(`[data-hab="${id}"][data-day="${dayKeyOf(now())}"]`);
    if(box && raw!==''){ box.classList.add('on'); box.setAttribute('aria-pressed','true'); }
  };
  habFlush[tk]=run;
  habTimers[tk]=setTimeout(run,300);
});

/* ================= aerobic tab ================= */
const aeroEl=document.getElementById('aero');
let aeroUid=0;
const newSid = () => 'a'+Date.now().toString(36)+(aeroUid++).toString(36);

/* v54: aeroDerived() is gone. It built a per-session line — speed, split, MET,
   MET-min — and then wrote it into a [data-ad] node that aeroSessHTML has never
   rendered, so no user has ever seen it. The week TOTAL is the number this tab
   is about; a per-session score invites optimising the session instead. */
function aeroFieldsHTML(e){
  const cfg=AEROT[e.t];
  const f=cfg.fields.map(x=>`<label class="mt"><span class="mtlab">${esc(x.label)}</span>
    <span class="mtbox">
      <input class="wtin mtin" type="number" step="${x.step}" inputmode="decimal"
             data-af="${e.s}" data-fk="${x.k}" value="${esc(e[x.k]??'')}" placeholder="${esc(x.ph??'')}"
             aria-label="${esc(x.label)} ${esc(cfg.label)}">
      <span class="unit">${esc(x.unit)}</span>
    </span></label>`).join('');
  return `<div class="mtwrap">${f}</div>`;
}
function aeroSessHTML(e){
  const cfg=AEROT[e.t]; if(!cfg) return '';
  const opts=DOW_FULL.map((nm,i)=>`<option value="${i}"${i===e.d?' selected':''}>${nm.slice(0,3)}</option>`).join('');
  return `<div class="arow first">
    <button class="ax" data-adel="${e.s}" aria-label="remove ${esc(cfg.label)}">×</button>
    <div class="arbody">
      <div class="arinfo">
        <select class="adaysel" data-aday="${e.s}" aria-label="day for ${esc(cfg.label)}">${opts}</select>
        <span class="arname"><span class="adot"></span><span class="aname">${esc(cfg.label)}</span></span>
      </div>
      ${aeroFieldsHTML(e)}
    </div></div>`;
}
/* v53: the week is no longer a seven-row scaffold with an add pill on every day.
   Six of those rows were always empty, and the pills asked which day before the
   user had said what. The list now shows only days that HAPPENED, and the four
   session types sit in one bar at the bottom — the thing you reach for after
   training, where a thumb already is. A new session lands on today and can be
   moved with the day select on its own row. */
function buildAero(){
  const td=dowOf(now());
  /* v53: one SESSION, one card. The day heading said what the day select on the
     session's own row already says, and a day is not the unit here — two rows
     under one "Thursday" read as one thing that happened twice. */
  /* v62: filter BEFORE wrapping. aeroSessHTML already returned '' for a type it
     did not recognise, but the <section> around it was written unconditionally,
     so an unknown `t` — from an old export, or a type retired later — painted an
     empty card with no name, no fields and no way to delete it. */
  const parts=(state.aero||[]).slice()
    .filter(e=>e&&AEROT[e.t])
    .sort((a,b)=>(a.d??0)-(b.d??0))
    .map(e=>`<section class="aday${e.d===td?' today':''}">${aeroSessHTML(e)}</section>`);
  const empty=parts.length?'':'<p class="anone">ยังไม่มี session สัปดาห์นี้ — กดปุ่มด้านล่างเพื่อเพิ่ม</p>';
  const add=AERO.map(a=>`<button class="aaddbtn" data-aadd="${a.t}">+ ${esc(a.label)}</button>`).join('');
  aeroEl.innerHTML=`
    <section class="atot" id="aprog">${aeroProgHTML()}</section>
    ${empty}${parts.join('')}
    <div class="aaddbar">${add}</div>`;
  document.getElementById('aerono').innerHTML =
    state.deload ? 'deload · easy work only, ~50–60% of usual · no 4×4' : '';
}
/* progression strip. The bar is scaled so the peak sits well inside it — a week
   that goes past the previous best should look like it went past, not like it
   merely filled a bar. Uncoloured logic: no red above the line, no green below
   it. The +10% mark is a hint, not a limit, and a deload week is meant to be
   short. */
/* v65: three views of the same strip, cycled by tapping the label. Each view
   is just a (totals key, peak function, unit, decimals) tuple — the bar/tick/
   fraction markup underneath does not know or care which one is showing. The
   choice lives in the localStorage mirror (see UIAVIEW), not `state`: it is a
   per-device reading preference, not data, so it is never synced or exported
   and never resets at rollover the way a logged week does. */
const AERO_VIEWS={
  min:   {label:'mins',        key:'min',    unit:'min',     dp:0, peak:()=>aeroPeak(histRecs)},
  height:{label:'height',      key:'height', unit:'m',       dp:0, peak:()=>aeroPeakHeight(histRecs)},
  met:   {label:'METs · mins', key:'metMin', unit:'MET·min', dp:0, peak:()=>aeroPeakMet(histRecs)}
};
const AERO_VIEW_ORDER=['min','height','met'];
function aeroView(){
  const v=(store.mirrorGet(UIAVIEW)||{}).id;
  return AERO_VIEWS[v] ? v : 'min';
}
function aeroViewNext(){
  const cur=AERO_VIEW_ORDER.indexOf(aeroView());
  const next=AERO_VIEW_ORDER[(cur+1)%AERO_VIEW_ORDER.length];
  store.mirrorSet(UIAVIEW,{id:next});
  return next;
}
function fmtN(v,dp){ return dp>0 ? (Math.round(v*Math.pow(10,dp))/Math.pow(10,dp)).toFixed(dp) : String(Math.round(v)); }
function aeroProgHTML(){
  const view=aeroView(), V=AERO_VIEWS[view];
  const t=aeroTotals(aeroNow())[V.key];
  const pk=V.peak()[V.key];
  const bar=(cur,ref,scale,soft)=>{
    const w=Math.max(cur?1.5:0, Math.min(100, cur/scale*100));
    return `<span class="apfill" style="width:${w.toFixed(1)}%"></span>
      <span class="aptick" style="left:${Math.min(100,ref/scale*100).toFixed(1)}%"></span>
      <span class="aptick soft" style="left:${Math.min(100,soft/scale*100).toFixed(1)}%"></span>`;
  };
  const pct=Math.round(t/pk*100);
  const s=Math.max(pk*1.35, t||0, 1);
  return `<div class="apblk">
      <div class="aprow">
        <button class="aplab" type="button" data-aview aria-label="switch view, currently ${esc(V.label)}">${esc(V.label)}</button>
        <span class="apval">${pct}%</span>
      </div>
      <div class="apbar" role="img" aria-label="${fmtN(t,V.dp)} of ${fmtN(pk,V.dp)} ${V.unit}, ${pct}%">
        ${bar(t,pk,s,pk*1.1)}
      </div>
      <div class="apsub"><b>${fmtN(t,V.dp)}</b> / ${fmtN(pk,V.dp)} ${V.unit}</div>
    </div>
    <div class="apsubrow">
      <details><summary>History</summary><div class="histbody">${aeroHistHTML()}</div></details>
    </div>`;
}
/* redraw everything derived from the week aerobic total.
   v51: the .atotline branch and aeroTotText() are gone — there has been no
   .atotline element since the progression strip replaced the totals card, so
   half of this function was querying for a node that could not exist. */
function aeroRefreshTot(){
  const pg=document.getElementById('aprog');
  if(pg) pg.innerHTML=aeroProgHTML();
}
/* no green, no red. Volume that went down in a deload week is not a loss, and a
   tracker that grades weekly minutes gets read as a verdict — same reasoning
   that keeps the body-weight delta uncoloured. */
function aeroHistHTML(){
  const rows=[];
  for(const r of histRecs){ rows.push({week:r.week,t:aeroTotals(aeroList(r)),dl:!!r.dl}); if(rows.length>=8) break; }
  if(!rows.length) return '<p class="histcap">No history yet — the first row lands when the week rolls over</p>';
  let h='<p class="histcap">Weekly totals · uncoloured on purpose: a lighter deload week is not a loss</p><table class="h m">';
  for(const r of rows){
    const t=r.t;
    const cell=t.n?`${t.n} sess · ${t.min} min`:'—';
    h+=`<tr><td class="w">${r.week.slice(5)}</td><td class="kg">${cell}</td><td class="d">${r.dl?'deload':''}</td></tr>`;
  }
  return h+'</table>';
}
aeroEl.addEventListener('click',e=>{
  const view=e.target.closest('[data-aview]');
  if(view){ aeroViewNext(); aeroRefreshTot(); return; }
  const add=e.target.closest('[data-aadd]');
  if(add){
    state.aero=state.aero||[];
    state.aero.push({s:newSid(),d:dowOf(now()),t:add.dataset.aadd});
    save(); buildAero(); return;
  }
  const del=e.target.closest('[data-adel]');
  if(del){
    state.aero=(state.aero||[]).filter(x=>x.s!==del.dataset.adel);
    save(); buildAero(); return;
  }
});
aeroEl.addEventListener('change',e=>{
  const sel=e.target.closest('[data-aday]');
  if(!sel) return;
  const ent=(state.aero||[]).find(x=>x.s===sel.dataset.aday);
  if(!ent) return;
  ent.d=Number(sel.value);
  save(); buildAero();
});
/* v54: the same debounce the habit tab got in v50. This listener called save()
   on every keystroke, so typing "5000" into a rowing distance wrote the whole
   blob four times — and wrote "5", "50" and "500" as real weeks in between. */
let aeroTimer=null;
function saveAeroSoon(){ clearTimeout(aeroTimer); aeroTimer=setTimeout(()=>{aeroTimer=null;save();},300); }
aeroEl.addEventListener('input',e=>{
  const f=e.target.closest('[data-af]');
  if(!f) return;
  const ent=(state.aero||[]).find(x=>x.s===f.dataset.af);
  if(!ent) return;
  if(f.value==='') delete ent[f.dataset.fk]; else ent[f.dataset.fk]=f.value;
  aeroRefreshTot();
  saveAeroSoon();
});

/* ================= deload week =================
   Read-only. No checks, no numbers, no storage key of its own.
   A deload week is still logged on the Exercises tab — tick the item, leave the
   kg box empty, and it archives as {done:1}, the "did it, logged nothing" state
   the model already has. That keeps a light week out of the delta maths instead
   of printing it as a loss, and it avoids a second set of weekly state with its
   own rollover, which is the double-archive path the invariants warn about. */
const DELOAD_PRINCIPLES=[
 {h:'Weights',t:'<b>ลดเซ็ตลง 40–50% · น้ำหนักเท่าเดิม</b> — ความล้าลดตามปริมาณ แต่ความแข็งแรงเสียไปกับน้ำหนักที่ลด ตัดเซ็ตก่อนเสมอ (RDL เป็นข้อยกเว้น ดูวันพฤหัส)'},
 {h:'What to cut',t:'ตัด<b>ท่าที่ทำให้ปวดกล้ามเนื้อมากที่สุด</b>ก่อน (Nordic curl, Bulgarian split squat) ไม่ใช่ตัดท่าที่ทำง่าย จุดประสงค์คือให้เนื้อเยื่อได้ซ่อม'},
 {h:'Cardio',t:'<b>ตัดงานหนักออกทั้งหมด</b> (4×4) เก็บงานเบาไว้ที่ ~50–60% ของ<b>ยอดนาทีรวม</b>ในแท็บ Aerobic — ฐานแอโรบิกหายช้ามาก ไม่ต้องกลัวเสียของ · ยอดที่ลดในสัปดาห์นี้ไม่ถูกทำเครื่องหมายว่าถดถอย'},
 {h:'When',t:'ทุก 4–6 สัปดาห์ หรือเมื่อ<b>น้ำหนักไม่ขึ้น 2 สัปดาห์ติด · นอนไม่ดี · ชีพจรตอนเช้าสูงกว่าปกติ · ไม่อยากซ้อม</b> — สัญญาณมาก่อนตารางเสมอ'},
 {h:'Watch for',t:'ใช้สัปดาห์ deload ไป<b>ไล่ตามงานที่ค้าง</b>จนกลายเป็นสัปดาห์ปกติที่กระจัดกระจาย · หรือหยุดสนิททั้งสัปดาห์จนกลับมาแล้วฟอร์มพัง — deload คือลดปริมาณ ไม่ใช่หยุด'}
];
/* Derived from PLAN, never a second copy of it: an exercise added to PLAN without
   a rule here shows up with the strength default, and the test asserts every id
   is either ruled or explicitly defaulted. Two hand-written lists would drift,
   and the drift would only surface on a deload week — the worst time to find it. */
const DELOAD_DEFAULT='2 sets · same load';
/* v54: f1, m2 and u1 are deleted. They were rules for ids that left PLAN when
   v53 moved cardio to the Aerobic tab, so they matched nothing and did nothing.
   The test the comment above describes only walks PLAN → rules; it never walked
   rules → PLAN, which is why three dead entries survived two versions.
   NOTE the namespace: these keys are PLAN ids. 'x4' here would mean the
   Meditation habit, NOT the 4×4 — that lives in AERO under `t`. The
   4×4's deload rule is the line in DELOAD_PRINCIPLES, not a key here. */
const DELOAD_RULES={
  m1:{skip:'cut — jumping is impact, the opposite of a repair week'},
  t2:{skip:'cut — the biggest muscle-damage driver here'},
  h2:{skip:'cut — sore easily, eats the next day'},
  e6:{skip:'cut — slow eccentric, as sore as the Bulgarian'},
  h1:{dose:'2 × 8 · <b>−20% load</b>',tag:'lighter'},
  e1:{dose:'2 sets · <b>bodyweight</b>, no load',tag:'lighter'},
  h4:{dose:'2 sets · <b>more assist</b>',tag:'more assist'},
  /* v58: the warm-up is the one thing a repair week must not lose — it is the
     part that protects the session, not the part that taxes it. Only the pogo
     hops come out, for the same reason the bounds do. */
  wu1:{dose:'10 นาที · <b>ข้าม pogo hop</b>'},
  wu2:{dose:'10 นาที · <b>ข้าม pogo hop</b>'},
  wu3:{dose:'10 นาที · <b>ข้าม pogo hop</b>'},
  t3:{skip:'cut — maximal-intent rotation, same reason as the bounds'},
  /* v59: CAT is speed work. A repair week has nothing to potentiate. */
  c1:{skip:'cut — maximal-intent speed work, nothing to potentiate this week'},
  c2:{skip:'cut — maximal-intent speed work, nothing to potentiate this week'},
  h5:{dose:'2 เที่ยว · <b>−30% load</b>',tag:'lighter'}
};
/* what this item becomes in a deload week */
function deloadOf(it){
  const r=DELOAD_RULES[it.id];
  if(r&&r.skip) return {skip:1,why:r.skip,alt:r.alt||null};
  if(r&&r.dose) return {dose:r.dose,tag:r.tag||''};
  return {dose:DELOAD_DEFAULT};
}
/* collapsed by default: the principles are worth re-reading on the day you flip
   the switch, and worth staying out of the way on the other six */
function deloadIntroHTML(){
  const intro=DELOAD_PRINCIPLES.map(p=>
    `<div class="pr"><span class="prh">${esc(p.h)}</span><p class="prt">${p.t}</p></div>`).join('');
  return `<details class="prbox"><summary>Deload principles</summary>${intro}</details>`;
}
document.getElementById('dltoggle').addEventListener('click',()=>{
  state.deload=!state.deload;
  save();
  buildWeek();
  buildAero();
});

/* ================= tabs ================= */
/* v20: the daily log is two round trips that the week tab never needs, so it is
   read on first mount instead of at boot. The promise is memoised, so a fast
   double-tap on the tab cannot start two reads and race them into dayLog. */
let dailyReady=null;
async function mountDaily(){
  if(!dailyReady){ perf.mark('daily:load-start'); dailyReady=loadDaily().then(()=>perf.mark('daily:load-done')); }
  await dailyReady;
  buildDaily();
}
const TABS=[
  {id:'week',  label:'Resistance', pane:'pane-week',  mount:buildWeek},
  {id:'aero',  label:'Aerobic',   pane:'pane-aero',  mount:buildAero},
  {id:'daily', label:'Routines',  pane:'pane-daily', mount:mountDaily}
];
const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=TABS.map(t=>
  /* v62: the panes carry role=tabpanel and point back here with
     aria-labelledby, so each tab needs a stable id to be pointed at. */
  `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="false" aria-controls="${t.pane}"><span class="tl">${t.label}</span></button>`
).join('');
let curTab='week';
function showTab(id){
  const t=TABS.find(x=>x.id===id)||TABS[0];
  curTab=t.id;
  for(const x of TABS){
    document.getElementById(x.pane).classList.toggle('on',x.id===t.id);
    tabsEl.querySelector(`[data-tab="${x.id}"]`).setAttribute('aria-selected',x.id===t.id?'true':'false');
  }
  t.mount();
  store.mirrorSet(UITAB,{id:t.id});   /* sync: read back at parse time next boot */
  store.set(UITAB,{id:t.id});
}
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(b) showTab(b.dataset.tab);
});

/* ================= init ================= */
/* v20 boot shape. v19 was six round trips in a chain and nothing painted until
   the last one landed, because showTab is what makes a .pane visible.
     wave 1  KEY + HIDX          (parallel)
     wave 2  history shards      (parallel, usually one)
     paint
   UITAB is gone from the path entirely — read synchronously from the mirror.
   loadDaily is gone too — it happens on first mount of the Routines tab.
   The rollover still runs BEFORE the paint. It can blank the week, so painting
   first would mean painting a week the archive is about to take away. */
(async function init(){
  const tab=(store.mirrorGet(UITAB)||{}).id||'week';   /* sync, 0 round trips */
  perf.mark('init-start');
  const [s,idx]=await Promise.all([store.get(KEY),store.get(HIDX)]);
  perf.mark('wave1');
  applyState(s);
  await loadHist(idx);
  perf.mark('wave2');
  await rollIfStale();
  perf.mark('roll');
  showTab(tab);
  perf.mark('painted');
  document.body.dataset.ready='1';
  if(location.search.includes('perf')) perf.dump();
})();

/* ---- the app outlives the day it was opened on ----
   v22 rolled the week only at boot. Left open overnight it kept yesterday's
   `today` marker, and left open across Sunday→Monday it kept a week that should
   already be archived — with the next tick landing in the wrong week. */
let lastDay=dayKeyOf(now());
let rollBusy=false;
document.addEventListener('visibilitychange',async()=>{
  /* v54: a debounced write must never be outlived by the tab. Backgrounding the
     app 100ms after the last keystroke would otherwise drop it.
     v62: flushWrites actually issues them; save() only rescheduled. */
  if(document.hidden){ flushWrites(); return; }
  if(document.body.dataset.ready!=='1'||rollBusy) return;
  const dk=dayKeyOf(now());
  if(dk===lastDay && !isStale(state.weekStart,now())) return;
  lastDay=dk;
  rollBusy=true;
  try{
    await rollIfStale();
    buildWeek();
    buildAero();
    if(dailyReady){ await dailyReady; buildDaily(); }
  } finally { rollBusy=false; }
});
/* v62: visibilitychange does not fire on every teardown — a swipe-away or a
   memory kill on iOS can go straight to pagehide. Same flush, both doors. */
window.addEventListener('pagehide',flushWrites);
</script>
