<!DOCTYPE html>
<!--
  ============================================================================
  Training Week — v64
  ============================================================================

  WORKING RULES (ask Claude to follow these on every edit)
  ---------------------------------------------------------------------------
  1. VERSION EVERY FILE. Never save over the previous one. The working copy is
     `training vNN.html`; NN goes up by one per round of changes, and the old
     file stays on disk so a regression can be bisected against it.
  2. The deployed file is a COPY named `index.html` (Vercel serves it at the
     root). It is byte-identical to `training vNN.html` — index.html is never
     edited directly, or the two silently drift.
  3. The zip shipped to the user is `training vNN.zip` and contains
     `training vNN.html` plus the test file. `index.html` is delivered
     separately, outside the zip.
  4. Write these rules into this comment in every version.
  5. Tests are Claude's, not the user's: `test.js` runs under Node + jsdom and
     Claude runs it. The user is never asked to install anything or run a
     command. Every bug fixed gets a test that fails on the old file and passes
     on the new one.
  6. Say what changed and why. A fix with no note becomes a mystery on the next
     pass — most of the comments in this file exist because of that.

  v62 — bug fixes only, no behaviour or design changes
  ---------------------------------------------------------------------------
  A  loadDaily  · setMonth(m-1) on the 29th–31st landed in the CURRENT month, so
                  the previous month's shard was never read: the habit grid and
                  the 30-day density undercounted for three days a month.
  B  buildDump  · the same arithmetic, 24 times. An export taken on the 31st
                  covered 14 distinct months out of 24 and silently dropped the
                  rest — holes in the only backup the app has.
  C  flushWrites· backgrounding the app called save(), which STARTS a 300ms
                  timer, so the pending write was rescheduled rather than
                  issued, and iOS suspends timers on the way out. It also only
                  looked at aeroTimer; the weight and habit-field timers were
                  never flushed at all. Now on visibilitychange AND pagehide.
  D  applyState · shapes are validated, not just defaulted. An imported dump with
                  weights as a string made every later write a silent no-op, and
                  a null in the aero list crashed the Aerobic tab outright.
  E  loadHist   · years are coerced to numbers and deduped. ['2026', 2026] read
                  one shard twice: history rows appeared twice with a delta of 0,
                  and phaseEarned() counted each incline week twice, advancing
                  the ladder at double speed. runImport no longer writes the
                  duplicate (it sorted the index lexicographically).
  F  buildAero  · an unrecognised session type painted an empty, undeletable card.
  G  smaller    · metRange/f1 no longer throw on a null MET · the incline speed
                  placeholder is formatted like the rung it comes from (5.0, not
                  5) · a superset with nothing left to tick no longer draws a
                  dead checkbox · the score row is a role=group, not a <label>
                  wrapping buttons · the panes carry role=tabpanel.

  Known, deliberate, NOT a bug: a weight typed before the deload switch is
  flipped is still archived with dl:1 and still prints a delta. The number was
  real, the row says "deload" beside it, and dropping it would need a second
  rule about when a logged number stops counting.

  v63 — cosmetic only
  ---------------------------------------------------------------------------
  A  buildBW · the running file version now prints on screen: a small
               "v63" line under the Body weight label, bottom-left of the
               Week tab, same font as that label. Bump APP_VERSION each
               time a new training vNN.html is cut and it follows without
               another code change.
  B  buildBW/CSS · the version line was first added as a 4th item inside
               .bwcard's own flex-wrap, which blew up #bwcard's measured
               width (200px → 230px) and misaligned every footer button
               after it. Split .bwcard into a plain block wrapper holding
               a .bwrow flex row (label/input/History, unchanged) plus the
               .bwver line stacked below by normal block flow — no nested
               flex-wrap, so the footer buttons sit exactly where v62 put
               them.

  v64 — cosmetic only
  ---------------------------------------------------------------------------
  A  CSS · .bwver's gap under Body weight was margin-top:2px, visibly
           tighter than the 16px row-gap footer uses when export json /
           import json wrap onto their own line. Both are now 16px, so
           the two gaps read as the same rhythm.
  ============================================================================
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    /* v35 "Midnight Dial" · no monospace, quieter chrome, one accent
       (v33 note follows)
       v33 "Midnight Dial": a dark instrument panel, one warm metal accent.
       Numbers are the content of this app, so they get the mono face and the
       brass; everything else stays quiet enough for the numbers to read. */
    --paper:#0A0C0F;
    --card:#14171B;
    --card2:#191D22;
    /* v42 — the light model.
       --fill: a card is no longer a flat swatch. It carries its own top-to-bottom
       gradient, so its surface agrees with the overhead source instead of just
       wearing a lit edge and ignoring it.
       --edge: the top edge IS the border. Until v41 a card drew a 1px border all
       round AND a 1px hairline just inside it — two lines stacked, which is why
       the light read as a sticker rather than an edge. The top border is now
       transparent and the hairline occupies that row alone.
       --foot: the dark inset line that closes the card at the bottom. A lit top
       without a shaded bottom is a highlight; with one, it's an object. */
    /* v45: the shading lives INSIDE the fill now. A dark bottom border was
       #0000008C over a #0A0C0F page — measured, it rendered (11,13,16) against a
       page of (10,12,15): invisible. The bevel is the last 8% of the gradient
       instead, so the card darkens into its own bottom edge and the light
       hairline has something to sit on. */
    /* v47: fill darkened 6 steps (darklab D). The card's foot now lands within
       ~1 step of the page, so the bottom of a card dissolves into the paper and
       --edge2 is the only thing closing it — keep that hairline if you retune.
       --ink dropped D5DCE1 -> CCD3D9 to match: on the darker surface the old
       value read as a notch too hot. --muted/--dim unchanged; they were already
       sitting on this side of the range. */
    --fill:linear-gradient(#13171D 0%,#0E1114 92%,#0B0D10 100%);
    --fill-done:linear-gradient(#0E1114,#0A0C0F);
    --edge:#FFFFFF3B;
    /* v44: the bottom edge is two facts, not one. --foot is the shadow the card
       casts on itself; --edge2 is the sliver of the same overhead light that a
       rolled bottom edge would still catch. Opposite polarity, so they read as
       one bevel rather than as two lines. Set --edge2 to transparent to go back
       to a purely dark foot. */
    --edge2:#FFFFFF1C;
    /* v45: a sub-pixel BOX does not survive. `height:.5px` laid out fine and
       then snapped away at paint — sampled at DPR8 the row was pure fill, and
       the same was true of the top hairline, which is why v44's edges went soft
       and the bottom looked broken. A 1px box scaled on the compositor does
       render: the GPU antialiases it into a real half-pixel. */
    --hair:.5;
    --ink:#CCD3D9;
    --muted:#8A959C;
    --dim:#616D75;
    --line:#FFFFFF12;
    --brass:#D6B27C;
    --brass2:#8E7549;
    --r:18px;     /* card */
    --rc:10px;    /* control */
    --s1:19px;
    --s2:15px;
    --s3:13px;
    --s4:11px;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,"IBM Plex Sans Thai Looped",sans-serif;
    /* v41: two faces earn a place in the head of a card and nowhere else.
       --serif is the day's NAME — a name, not a datum, so it is set like prose.
       --tag is the day's SLOT in the week — a fixed-advance face because that is
       what a three-letter code in a column of seven wants. Neither leaks into
       the body: --mono still aliases the sans, as of v35. */
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --tag:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    /* v35: no monospace anywhere. Tabular figures give the column alignment
       that the mono face was there for, without the typewriter texture. */
    --mono:var(--sans);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--paper);}
  /* one light source, top centre — the page reads as a lit object instead of a
     flat black rectangle, and the cards below it have something to sit on */
  body{
    margin:0 auto;max-width:560px;
    padding:18px 16px calc(48px + env(safe-area-inset-bottom));
    background:transparent;
    color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  /* v39: the light source is painted on a fixed layer, so its geometry is the
     viewport's, not the document's. On body it was sized to the page, which meant
     opening a card re-scaled and repainted the whole gradient. */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(88% 34% at 50% -6%,#2A3540 0%,rgba(42,53,64,0) 68%);
  }
  /* v42: grain. The source is a wide, low-contrast wash over near-black — the
     exact condition that bands into visible rings on an OLED. Noise at 7% in
     overlay costs one data-URI and makes the gradient continuous. It sits above
     everything so the cards are grained too; without that the cards look like
     cut-outs pasted onto a textured page. */
  body::after{
    content:"";position:fixed;inset:0;z-index:9;pointer-events:none;
    opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  .brand{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:30px;padding:0 0 14px;}
  .bname{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.34em;
    text-transform:uppercase;color:var(--brass);opacity:.85;padding-left:4px;
  }

  .eyebrow{font-family:var(--mono);font-size:var(--s4);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);font-weight:500;}
  .eyebrow.th{font-size:var(--s3);letter-spacing:0;text-transform:none;}

  /* ---------- tabs ----------
     v35: the segmented pill was a plastic widget sitting on a metal panel. A
     row of words under a hairline, with one of them lit and underscored in
     brass, says the same thing and lets the cards be the only objects. */
  .tabs{display:flex;margin:2px 2px 20px;border-bottom:1px solid var(--line);}
  .tab{
    flex:1;padding:0 0 12px;border:0;background:transparent;font:inherit;
    font-size:var(--s3);font-weight:500;letter-spacing:.02em;
    color:var(--dim);cursor:pointer;transition:color .18s;
  }
  /* the rule hugs the word, not the third it sits in */
  .tl{position:relative;display:inline-block;}
  .tl::after{
    content:"";position:absolute;left:-6px;right:-6px;bottom:-13px;height:1.5px;border-radius:999px;
    background:linear-gradient(90deg,var(--brass2),var(--brass));
    transform:scaleX(0);transition:transform .22s cubic-bezier(.4,0,.2,1);
  }
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;}
  .tab[aria-selected="true"] .tl::after{transform:scaleX(1);}
  .pane{display:none;}
  .pane.on{display:block;}

  .weekbar{display:flex;align-items:center;gap:8px;padding:0 2px 10px;}
  #pane-aero .weekbar,#pane-daily .weekbar{display:none;}
  .weekno{font-family:var(--mono);font-size:var(--s4);color:var(--dim);flex:1;letter-spacing:.04em;}
  .weekno b{color:var(--muted);font-weight:500;}

  /* ---------- day ---------- */
  .day{
    position:relative;overflow:hidden;
    background:var(--fill);border:1px solid var(--line);
    /* v43: no top border at all. `transparent` still reserved the row, and the
       card's own fill painted through it (background-clip defaults to
       border-box) — a 1px band of surface sitting ABOVE the highlight, which is
       what made the edge look soft. With the row gone the hairline is the
       topmost pixel of the card. */
    /* v45: no bottom border either — see --fill. Both lit edges are now the
       card's own first and last pixel row, with nothing under or over them. */
    border-top:0;border-bottom:0;
    border-radius:var(--r);
    margin-bottom:8px;transition:background .18s;
  }
  .day::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    transform:scaleY(var(--hair));transform-origin:top;
    background:linear-gradient(90deg,transparent 8%,var(--edge) 24%,var(--edge) 76%,transparent 92%);}
  /* v44: the light the bottom edge catches. Sits above `.prog`, so it survives
     the progress band the way the dark foot (a border) does. */
  .day::before{content:"";position:absolute;left:0;right:0;bottom:0;height:1px;
    transform:scaleY(var(--hair));transform-origin:bottom;
    z-index:2;pointer-events:none;
    background:linear-gradient(90deg,transparent 12%,var(--edge2) 29%,var(--edge2) 71%,transparent 88%);}
  .day.done::before{opacity:.4;}
  .day.done{background:var(--fill-done);border-color:#FFFFFF08;border-top:0;border-bottom:0;}
  .day.done::after{opacity:.4;}
  .day.done .title{color:var(--dim);}
  .day.open{box-shadow:0 18px 40px -22px #000;}
  .day.today .title::after{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-left:7px;
    box-shadow:0 0 8px var(--accent);
  }
  /* ---------- head (v38 "B1") ----------
     The day name is the object of the card and sits on the card's true vertical
     centre. A flow-centred stack would put the STACK's middle there, leaving the
     title half a dow-block low; the transform lifts it by exactly that half
     without moving the layout box, so the chevron and the progress rule stay put.
     v39: 84 → 66px. The stack is 42px tall, so at 66 the dow sits ~2.5px off the
     top edge and the title still lands on the card's exact middle — the transform
     is unchanged because it depends on the stack, not the card.
     v40: lift eased 9.5 → 7px. The dow was reading as flush with the top edge, so
     the whole stack drops 2.5px; the title now sits 2.5px under true centre, which
     is under the threshold where the eye calls it off.
     v41: the label dropped to 10px, so half a dow-block is now (13+5)/2 = 9, and
     the same 2.5px offset makes the lift 6.5px. The stack grew 1.1px overall; the
     card stays 66. */
  .head{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;min-height:66px;padding:10px 46px;
    background:none;border:0;font:inherit;color:inherit;cursor:pointer;
    touch-action:manipulation;
  }
  .stk{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;
    transform:translateY(-6.5px);}
    /* v41: Plex Mono at 10px/.03em. Mono carries its own fixed advance, so the
     .14em that a proportional face needed to read as an eyebrow made this one
     look stretched — .03em is the least that still says "label". */
  .dow{font-family:var(--tag);font-size:10px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--dim);font-weight:500;line-height:1.3;}
    /* v41: the title is the one piece of prose on the card — everything else is a
     number, a code or a state. A serif says that without a rule or a colour. */
  .title{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.005em;
    line-height:1.2;text-align:center;}
  .chev{position:absolute;top:50%;right:16px;transform:translateY(-50%);
    width:16px;height:16px;color:var(--muted);transition:transform .2s;}
  .chev svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:3;}
  .day.open .chev{transform:translateY(-50%) rotate(180deg);}

  /* v38: the count is gone. Closed, this line is the card's foot; open, it is the
     rule between the head and the list — same object, same meaning, new position.
     A number you have to read becomes a shape you only have to see. */
  /* v45: no track. #FFFFFF0A across the foot of every card was a permanent 2px
     light band sitting exactly where the bottom edge now is — two bright rows
     arguing over the same job. An empty card shows nothing; the fill IS the
     sentence. */
  .prog{display:block;height:2px;background:none;}
  .prog i{display:block;height:100%;width:0%;border-radius:0 999px 999px 0;
    background:linear-gradient(90deg,var(--brass2),var(--brass));
    transition:width .25s cubic-bezier(.4,0,.2,1);}

  .body{display:none;padding:2px 0 14px;}
  .day.open .body{display:block;}
  /* the day's own close-out control: styled to read as one more row in the
     list, not a separate action, so finishing the day is as light a tap as
     ticking any other exercise. */
  .finishgrp{margin-top:6px;padding-top:8px;border-top:1px solid #FFFFFF0A;}
  .finishgrp .name{color:var(--dim);}

  /* ---------- item (v38 "C") ----------
     One row per exercise. The dose flows straight on from the name (W3) so a
     long name spends the tail of its second line instead of claiming a row of
     its own — a full gym day fits one screen, which is the state it is actually
     read in: phone on the bench, mid-set. */
  .grp{padding:0 18px;}
  .sslab{
    font-size:var(--s4);letter-spacing:.2em;text-transform:uppercase;font-weight:500;
    color:var(--dim);margin:0;padding:14px 0 3px;
  }
  .sslab:empty{display:none;}
  /* v52: a superset is one decision, so it gets one checkbox — on the label row,
     level with the pair rather than inside either half of it. The exercises below
     it keep their weight fields and their detail roundels; they just no longer
     each ask to be ticked. The BACKEND is unchanged: this box writes state.checks
     for every id in the group, so history, deltas and rollover still see the
     individual exercises exactly as before. */
  .grphead{display:flex;align-items:center;gap:10px;padding:14px 0 3px;}
  .grphead .sslab{padding:0;}
  .grphead+.item{border-top:0;}
  /* nothing to tick on this row, so the name starts where the others' names do */
  .item.nobox{padding-left:34px;}

  /* the live pair: whichever group holds the next unticked exercise. The tint
     bleeds to the card edges so the pair reads as one object at arm's length. */
  .grp.now{position:relative;background:var(--tint);
    margin:6px 0;padding-bottom:6px;}
  .grp.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;
    background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent),black 55%));}
  .grp.now .sslab{color:var(--accent);opacity:.7;}
  .day.done .grp.now{background:none;box-shadow:none;}

  .item{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:52px;}
  .item+.item{border-top:1px solid #FFFFFF0A;}
  .sslab+.item{border-top:0;}
  .item.on .name{color:var(--muted);}
  .box{
    width:24px;height:24px;flex:none;padding:0;touch-action:manipulation;
    border:1px solid #FFFFFF24;border-radius:var(--rc);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .box svg{width:13px;height:13px;fill:none;stroke:#0A0C0D;stroke-width:3.2;opacity:0;transition:opacity .15s;}
  .box.on{background:var(--accent);border-color:var(--accent);}
  .box.on svg{opacity:1;}
  /* no overflow-wrap:anywhere here — it gave the browser permission to break
     the NAME mid-phrase rather than move the unbreakable dose down a line. */
  .txt{flex:1;min-width:0;}
  .name{font-size:var(--s2);font-weight:500;letter-spacing:-.008em;line-height:1.4;}
  /* W3: the dose flows on from the name and, now that it is only the sets, it
     stays whole — if it will not fit the tail of the line it drops to the next
     one entire, rather than snapping "3 × 8 / side" in half. */
  .dose{font-size:var(--s4);color:var(--dim);margin-left:7px;white-space:nowrap;}
  .dosefull{font-size:var(--s4);color:var(--muted);margin:0 0 10px;letter-spacing:.01em;}
  /* Detail shrank to a roundel to buy the row back; 22px keeps it thumbable. */
  /* v60: the ⓘ is the last thing on the row and the weight box sits before it.
     With the old order the button landed in a different place on a row with a
     kg field than on one without, so the column of circles zig-zagged down the
     day. Now every row ends with it, at the same x. */
  .idet{
    width:22px;height:22px;flex:none;padding:0;border-radius:50%;margin-left:auto;
    border:1px solid #FFFFFF1A;background:transparent;color:var(--dim);
    font:inherit;font-size:11px;font-style:italic;line-height:1;cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;
  }
  .item.det .idet{color:var(--accent);border-color:var(--accent);opacity:.9;}
  .drop{display:none;padding:0 8px 12px 34px;}
  .item.det + .drop{display:block;}

  /* weight */
  .wtwrap{display:flex;align-items:baseline;gap:4px;flex:none;align-self:center;margin-left:auto;}
  .wtwrap+.idet{margin-left:0;}
  /* v31: no spin buttons anywhere. Every one of these fields is typed, and the
     arrows only ever stole a tap target and nudged a logged number by accident. */
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .wtin{
    width:52px;height:32px;padding:0 2px;text-align:center;
    border:1px solid #FFFFFF14;border-radius:var(--rc);background:#12161B;
    font:inherit;font-family:var(--mono);font-size:15px;color:var(--brass);
    outline:none;letter-spacing:-.01em;
    box-shadow:0 1px 2px #00000080 inset;
    transition:border-color .15s;
  }
  .wtin::placeholder{color:#4E5B60;}
  .wtin:focus{border-color:var(--brass2);}
  .unit{font-family:var(--mono);font-size:var(--s4);color:var(--dim);}

  /* metric fields (runs, rowing) — stacked under the row, not squeezed into it */
  .mtwrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;margin:2px 0 12px 34px;}
  .mt{display:flex;flex-direction:column;gap:4px;}
  .mtlab{font-family:var(--mono);font-size:var(--s4);color:var(--dim);font-weight:500;
    letter-spacing:.08em;text-transform:uppercase;}
  .mtbox{display:flex;align-items:baseline;gap:5px;}
  .mtin{width:58px;}
/* v60: .derived and .aday .derived removed with derivedText */

  /* disclosures */
  /* v36: Detail is a continuation of the dose line — same size, weight and
     colour, sat right underneath it. It is a way in, not a second heading. */
  details{margin:2px 0 0 0;}
  summary{
    list-style:none;display:inline-block;cursor:pointer;padding:1px 0 3px;
    font-size:var(--s4);font-weight:400;color:var(--dim);letter-spacing:0;
    border-bottom:1px dotted #FFFFFF24;line-height:1.4;transition:color .15s;
  }
  summary::-webkit-details-marker{display:none;}
  details[open] summary{color:var(--muted);}
  .note{
    font-size:var(--s2);line-height:1.65;color:#AEB8BF;
    border-left:1px solid var(--line);padding:2px 0 2px 13px;margin:2px 0 4px;
  }
  .note b{font-weight:600;color:var(--ink);}
  .note .tl,.note .tn{margin:0 0 9px;}
  .note .tl:last-child,.note .tn:last-child{margin-bottom:0;}
  .note .lab{
    display:block;font-family:var(--mono);font-size:var(--s4);font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brass2);margin-bottom:4px;
  }
  .histbody{border-left:1px solid var(--line);padding:4px 0 2px 13px;margin:2px 0 4px;}
  .histsplit{border-top:1px solid var(--line);margin:12px 0 10px;}
  .histbody .eyebrow{display:block;margin-bottom:7px;}
  .histcap{font-size:var(--s3);color:var(--dim);margin:0 0 8px;line-height:1.45;}
  table.h{border-collapse:collapse;width:100%;max-width:240px;}
  table.h.m{max-width:none;}
  table.h.m td.kg{font-size:var(--s3);font-weight:400;}
  table.h td{font-family:var(--mono);font-size:var(--s3);padding:4px 0;}
  td.w{color:var(--dim);width:58px;}
  td.kg{color:var(--ink);font-weight:400;}
  td.d{text-align:right;color:var(--dim);}
  td.d.up{color:#7FCBA9;}
  td.d.dn{color:#E0899A;}
  tr.skip td{color:#4C585C;}

  [hidden]{display:none!important;}
  /* rest is printed, not timed: the watch on the wrist counts better than a tab
     that iOS is free to throttle the moment the screen goes dark. */
  .rst{font-family:var(--mono);font-size:var(--s4);color:var(--dim);letter-spacing:.02em;}

  /* ---------- body weight ---------- */
  .bwcard{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    background:none;border:0;border-radius:0;
    padding:0;margin:0 auto 0 0;
  }
  .bwlab{font-size:var(--s4);font-weight:400;color:#586369;flex:none;}
  /* v64: a footer-level item, not nested inside .bwcard's own flex-wrap — v63
     tried nesting it and that inflated #bwcard's measured width, misplacing
     every button after it (see the v63 §B note below). flex-basis:100% here
     just forces its own line the same way footer already wraps import json
     onto one, so the two line-gaps share the same footer `gap` and always
     match, instead of a hand-tuned margin trying to approximate it. */
  .bwver{flex-basis:100%;order:9;font-size:var(--s4);font-weight:400;color:#586369;}
  .bwcard .wtin{height:28px;width:60px;font-size:var(--s3);}
  .bwd{
    width:100%;font-family:var(--mono);font-size:var(--s4);color:var(--dim);margin-top:2px;
  }
  .bwcard details{margin:0;flex:none;}
  .bwcard details[open]{flex-basis:100%;}
  .bwcard .wtin{background:#0B0D10;}

  /* ---------- deload tab ---------- */
  .prbox{
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);
    padding:14px 16px;margin-bottom:14px;
  }
  .pr{margin-bottom:13px;}
  .pr:last-child{margin-bottom:0;}
  .prh{
    display:block;font-family:var(--mono);font-size:var(--s4);font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brass2);margin-bottom:4px;
  }
  .prt{margin:0;font-size:var(--s2);line-height:1.6;color:#AEB8BF;}
  .prt b{font-weight:600;color:var(--ink);}
  .dltag{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
    background:var(--soft);color:var(--accent);
    font-size:var(--s4);font-weight:700;vertical-align:1px;
  }
  /* a cut exercise keeps its slot in the day so the shape of the week is still
     legible — it just carries no checkbox, because there is nothing to tick */
  .item.cut .txt{margin-left:36px;}
  .item.cut .name{text-decoration:line-through;color:#5A676C;font-weight:400;}
  .item.cut .dose{color:#5A676C;}
  .dose b{color:var(--accent);font-weight:600;}
  .dltoggle{
    flex:none;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    background:transparent;font:inherit;font-size:var(--s3);font-weight:600;
    color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  .dltoggle[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0A0C0D;}
  .prbox{margin-bottom:8px;}
  .prbox summary{padding:0;}
  .prbox .pr{margin-top:12px;}

  /* ---------- daily tab ---------- */
  .hab{
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);
    padding:16px;margin-bottom:8px;position:relative;overflow:hidden;
  }
  .habtop{display:flex;align-items:baseline;gap:10px;}
  .habname{font-size:var(--s1);font-weight:600;letter-spacing:-.015em;flex:1;line-height:1.25;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;}
  .gcell{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .gdow{font-family:var(--mono);font-size:var(--s4);color:var(--dim);font-weight:500;}
  .gbox{
    width:100%;height:38px;padding:0;
    border:1px solid #FFFFFF1A;border-radius:var(--rc);background:#FFFFFF05;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .gbox svg{width:13px;height:13px;fill:none;stroke:#0A0C0D;stroke-width:3.2;opacity:0;transition:opacity .15s;}
  .gbox.on{background:var(--brass);border-color:var(--brass);}
  .gbox.on svg{opacity:1;}
  .gcell.today .gdow{color:var(--ink);}
  .gcell.today .gbox{border-color:var(--muted);}
  .gcell.future .gbox{opacity:.35;}
  .todayrow{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  }
  .todaylab{font-family:var(--mono);font-size:var(--s4);letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);font-weight:500;align-self:center;}
  .scoreset{display:flex;gap:4px;}
  .sc{
    width:32px;height:34px;padding:0;border:1.5px solid var(--line);border-radius:var(--rc);
    background:transparent;font:inherit;font-size:var(--s3);color:var(--muted);
    cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,color .15s,border-color .15s;
  }
  .sc.on{background:var(--brass);border-color:var(--brass);color:#0A0C0D;font-weight:600;}
  /* v54: the 30-day count belongs on the title line — it is the card's summary,
     not a footnote under it */
  .density{font-family:var(--mono);font-size:var(--s4);color:var(--dim);letter-spacing:.02em;
    white-space:nowrap;flex:none;}
  .hab details{margin:12px 0 0;}

  /* ---------- footer ---------- */
  textarea{
    width:100%;min-height:96px;padding:14px;resize:none;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    font:inherit;font-size:var(--s2);color:var(--ink);outline:none;line-height:1.5;letter-spacing:-.01em;
  }
  textarea:focus{border-color:var(--brass2);}
  footer{display:flex;justify-content:flex-end;align-items:flex-start;gap:18px;margin-top:16px;padding:0 2px;}
  .link{background:none;border:0;padding:8px 2px;font:inherit;font-size:var(--s4);color:#586369;
    cursor:pointer;text-decoration:underline;text-decoration-color:#FFFFFF1F;text-underline-offset:3px;
    transition:color .15s;}
  .link[aria-expanded="true"],.link[aria-pressed="true"]{color:var(--brass);text-decoration-color:var(--brass2);}
  footer{flex-wrap:wrap;gap:16px;}

  /* ---------- transfer panel ----------
     No download, no file picker, no alert: the artifact runs in a sandboxed
     iframe where all three are silently ignored — the button appears dead. Text
     in a textarea is the one channel that cannot be blocked. */
  .io{
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);
    padding:14px 16px;margin-top:12px;
  }
  .iohead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .iota{
    width:100%;height:120px;resize:vertical;box-sizing:border-box;
    border:1px solid var(--line);border-radius:var(--rc);background:var(--paper);
    padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;line-height:1.4;color:var(--muted);
  }
  .iota:focus{outline:2px solid var(--brass2);outline-offset:1px;}
  .iorow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{
    padding:9px 14px;border:1px solid var(--brass);border-radius:999px;background:var(--brass);
    color:#0A0C0D;font:inherit;font-size:var(--s3);font-weight:600;cursor:pointer;
  }
  .btn.ghost{background:transparent;color:var(--ink);border-color:#FFFFFF24;}
  .btn.warn{background:#C4677C;border-color:#C4677C;color:#0A0C0D;}
  .iomsg{font-size:var(--s3);color:var(--muted);margin-top:10px;line-height:1.5;}
  .iomsg b{color:var(--ink);font-weight:600;}


  /* ---------- v28: session subtitle ---------- */
    /* v41: AM/PM is another word in the label, not a footnote on it — so it
     inherits every property rather than restating any. */
  .dow .sub{display:inline;font:inherit;letter-spacing:inherit;text-transform:inherit;
    color:inherit;white-space:nowrap;}

  /* ---------- v28: aerobic tab ---------- */
  .atot{background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);
    padding:14px 16px;margin-bottom:8px;}
  #aprog{background:none;border:0;border-radius:0;padding:0 2px;margin-bottom:14px;}
  #aprog::after,#aprog::before{display:none;}
  .atotsub{font-family:var(--mono);font-size:var(--s4);color:var(--dim);margin-top:7px;line-height:1.55;}
  .atotsub b{color:var(--ink);font-weight:600;}
  .atot details{margin:10px 0 0;}
  .aday{position:relative;overflow:hidden;background:var(--fill);
    border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);padding:12px 16px 14px;margin-bottom:8px;}
  /* v34: one card treatment everywhere — a hairline of light on the top edge.
     Coloured spines were the last piece of the old flat look. */
  .aday::after,.atot::after,.hab::after{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    transform:scaleY(var(--hair));transform-origin:top;
    background:linear-gradient(90deg,transparent 8%,var(--edge) 24%,var(--edge) 76%,transparent 92%);}
  .aday::before,.atot::before,.hab::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:1px;
    transform:scaleY(var(--hair));transform-origin:bottom;
    z-index:2;pointer-events:none;
    background:linear-gradient(90deg,transparent 12%,var(--edge2) 29%,var(--edge2) 71%,transparent 88%);}
  .atot{position:relative;overflow:hidden;}
  .ahead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .adow{font-size:var(--s2);font-weight:600;flex:1;min-width:64px;}
  .aday.today .adow::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--brass);vertical-align:middle;margin-left:7px;box-shadow:0 0 8px var(--brass);}
  .aadd{display:flex;gap:6px;}
  .arow{position:relative;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;}
  .arow.first{border-top:0;margin-top:0;padding-top:0;}
  .arbody{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:22px;}
  .arinfo{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .arname{display:flex;align-items:center;gap:8px;min-width:0;}
  .aname{font-size:var(--s2);font-weight:500;min-width:0;}
  /* v60: one colour. The dot used to be green for Z2 and orange for the 4×4,
     which read as a verdict on the session before it had been logged — the same
     reason the bars and the delta column are uncoloured. Brass says "this is a
     session", and the card already says which kind in words. */
  .adot{width:8px;height:8px;border-radius:50%;background:var(--brass);flex:none;}
  /* flush into the card's own corner — .aday's padding already insets it, so a
     negative offset here is what actually lands the button in the corner
     instead of visibly adrift below and left of it. */
  .ax{position:absolute;top:-8px;right:-10px;width:28px;height:28px;padding:0;border:0;background:none;
    font:inherit;font-size:16px;line-height:1;color:#5A676C;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .ax:hover{color:#E0899A;}
  .anone{font-size:var(--s3);color:var(--dim);margin:8px 0 0;}
  /* v35: six identical cards saying "nothing here" was most of this tab. An
     empty day gets one quiet line; a card is what having logged something
     looks like. */
  .aday.empty{background:none;border-color:transparent;box-shadow:none;
    padding:7px 4px;margin-bottom:0;}
  .aday.empty::after,.aday.empty::before{display:none;}
  .aday.empty .ahead{gap:6px;}
  .aday.empty .adow{font-size:var(--s3);font-weight:500;color:var(--muted);}
  .aemptywrap{border:1px solid var(--line);border-radius:var(--r);background:#FFFFFF04;
    padding:5px 12px;margin-bottom:8px;}
  .aemptywrap .aday.empty+.aday.empty{border-top:1px solid #FFFFFF08;}
  .aday .mtwrap{margin:0;}
  /* v54: one field per line, label and value on the same line — the fields are
     read one at a time while typing, not scanned as a row. */
  #pane-aero .mtwrap{flex-direction:column;align-items:stretch;gap:0;}
  #pane-aero .mt{flex-direction:row;align-items:center;gap:10px;padding:3px 0;}
  /* the label is a fixed column, so the value sits right beside it instead of
     being pushed out to the card edge */
  #pane-aero .mtlab{letter-spacing:.1em;flex:none;width:74px;}
  #pane-aero .mtbox{flex:none;}
  /* a logged number here is a record, not a headline — brass was shouting.
     v66: the boxed/pill look is gone too — an underline is enough to mark it
     editable, and a card of three or four of these no longer reads as a form. */
  #pane-aero .mtin{
    color:var(--ink);background:none;border:0;border-radius:0;box-shadow:none;
    height:auto;width:46px;padding:0 0 3px;text-align:left;
    border-bottom:1px solid #FFFFFF1F;
  }
  #pane-aero .mtin:focus{border-bottom-color:var(--brass2);}
  #pane-aero .mtbox .unit{min-width:34px;}

  /* ---------- v30: aerobic progression ---------- */
  .aprow{display:flex;align-items:baseline;gap:10px;}
  .aplab{font:inherit;font-size:var(--s3);color:var(--muted);font-weight:600;flex:1;min-width:0;
    background:none;border:0;padding:0;text-align:left;cursor:pointer;}
  .aplab:hover{color:var(--brass);}
  .apval{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--brass);}
  .apbar{position:relative;height:12px;border-radius:999px;background:#FFFFFF0F;
    margin:10px 0 8px;overflow:hidden;}
  .apfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,var(--brass2),var(--brass));transition:width .18s;}
  .aptick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.45;}
  .aptick.soft{opacity:.3;background:repeating-linear-gradient(to bottom,var(--ink) 0 3px,transparent 3px 6px);}
  .apsubrow{display:flex;align-items:baseline;gap:10px;}
  .apsubrow details{margin:0;}
  .apsub{font-family:var(--mono);font-size:var(--s4);color:var(--dim);line-height:1.55;}
  .apsub b{color:var(--ink);font-weight:600;}

  /* ---------- v53: two-bar strip + bottom add bar ---------- */
  .apblk+.apblk{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);}
  .apblk .apbar{margin:9px 0 7px;}
  .apsubrow{margin-top:12px;justify-content:space-between;}
  /* the four session types, where a thumb already is after training */
  .aaddbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 16px;}
  .aaddbtn{
    padding:14px 4px;border:1px dashed #FFFFFF2B;border-radius:var(--rc);background:#FFFFFF05;
    font:inherit;font-size:var(--s3);font-weight:600;letter-spacing:-.005em;line-height:1.3;color:var(--brass);
    text-wrap:balance;
    cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s,color .15s;
  }
  .aaddbtn:hover{border-color:var(--brass2);background:#FFFFFF0A;}
  /* a plain small-caps label, not a control that reads as a text field — the
     capsule it used to sit in implied a value worth double-checking, when a
     day is a one-tap correction at most. */
  .adaysel{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    flex:none;align-self:flex-start;margin:0;padding:0;border:0;background:none;
    font:inherit;font-family:var(--mono);font-size:var(--s4);font-weight:500;
    letter-spacing:.09em;text-transform:uppercase;color:var(--dim);cursor:pointer;
  }
  .adaysel:focus{outline:none;color:var(--brass);}
  .adaysel:hover{color:var(--muted);}

  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header class="brand">
  <span class="bname">Training Week</span>
</header>
<div class="tabs" role="tablist" id="tabs"></div>

<section class="pane" id="pane-week" role="tabpanel" tabindex="0" aria-labelledby="tab-week">
  <div class="weekbar" id="weekbar" hidden><span class="weekno" id="weekno"></span></div>
  <div id="dlintro"></div>
  <main id="days"></main>
  <footer>
    <section class="bwcard" id="bwcard"></section>
    <button class="link" id="dltoggle" type="button" aria-pressed="false">deload week</button>
    <button class="link" id="export" aria-expanded="false">export json</button>
    <button class="link" id="import" aria-expanded="false">import json</button>
    <button class="link" id="copylist" type="button">copy exercise list</button>
    <span class="bwver" id="bwver"></span>
  </footer>
  <section class="io" id="io" hidden></section>
</section>

<section class="pane" id="pane-aero" role="tabpanel" tabindex="0" aria-labelledby="tab-aero">
  <div class="weekbar"><span class="weekno" id="aerono"></span></div>
  <main id="aero"></main>
</section>

<section class="pane" id="pane-daily" role="tabpanel" tabindex="0" aria-labelledby="tab-daily">
  <div class="weekbar"><span class="weekno" id="dailyno"></span></div>
  <main id="habits"></main>
</section>

<script>
/* ================= config ================= */
const APP_VERSION = 'v64';              /* bump with every new training vNN.html */
const KEY    = 'trainweek:v11';         /* v21: ids remapped Mon–Sun → clean reset */
const HIDX   = 'trainweek:hist:index';
const HSHARD = y  => `trainweek:hist:${y}`;
const DSHARD = m  => `daily:log:${m}`;  /* m = 'YYYY-MM' */
const UITAB  = 'ui:tab';
const UIAVIEW = 'ui:aeroview';          /* which of mins/height/MET·mins the bar shows — per device, never synced or exported */
const ROLL_HOUR = 4;                    /* day + week boundary, local time */

/* v33: on a near-black field a mid-tone hue reads as mud, so every accent is
   lifted toward its metal — brass, jade, copper, amethyst, gold, steel. The
   check glyph is dark on all six, which is why .box svg strokes the paper. */
const KIND={
  strength:{accent:'#D6B27C',soft:'#D6B27C1A',tint:'#D6B27C0A'},
  z2      :{accent:'#6FBFA0',soft:'#6FBFA01A',tint:'#6FBFA00A'},
  interval:{accent:'#E08A66',soft:'#E08A661A',tint:'#E08A660A'},
  mobility:{accent:'#9B8AE6',soft:'#9B8AE61A',tint:'#9B8AE60A'},
  play    :{accent:'#E0BC6B',soft:'#E0BC6B1A',tint:'#E0BC6B0A'},
  rest    :{accent:'#7F8D92',soft:'#7F8D9224',tint:'#7F8D920E'}
};

const Z2NOTE =
 '<b>อยู่ที่ขอบของ VT1</b> · หา VT1 (เพดานของ "เบา") ได้เองโดยไม่ต้องใช้อุปกรณ์ · '+
 '<b>Talk test:</b> ระหว่างค่อยๆ เพิ่มความหนัก ให้อ่านประโยคออกเสียงทุก 5 นาที · '+
 'VT1 คือจุดที่<b>เริ่มต้องหยุดกลางประโยคเพื่อหายใจ</b> · '+
 'งานเบาทั้งหมดให้อยู่ต่ำกว่าจุดนั้นลงมาหนึ่งขั้น';

/* 0=Mon … 6=Sun, and the two names for it that the UI needs */
const DOWI={MON:0,TUE:1,WED:2,THU:3,FRI:4,SAT:5,SUN:6};
const DOW_TH=['M','T','W','T','F','S','S'];
const DOW_FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ================= plan · sessions, not days =================
   v28: a session carries its own `dow` instead of being found at PLAN[dow].
   Wednesday holds two — 4×4 in the morning, the full-gym session in the
   evening — and they are different KINDS, so one card with a divider inside
   would have had to pick one accent, one icon and one count for both. Two
   cards, two counts.
   v53: this tab is RESISTANCE ONLY. The 4×4, the long run and pickleball are
   aerobic work, and aerobic work is now logged in one place — the Aerobic tab —
   where a session carries its own day and its own numbers.
   Skater bounds stayed: it is a plyometric warm-up for the gym day, not cardio. */
const PLAN=[
 {dow:'MON',title:'Home gym',kind:'strength',items:[

/* ---- the 4×4's duration ----
   It is the one session with no Time field: 10 warm-up + n × 4 work +
   (n−1) × 3 rest + 5 cool is fixed by the protocol, so the rounds are the only
   thing worth asking for and the minutes follow from them. */
const X4={warm:10,work:4,rest:3,cool:5};
/* v60 deleted a body-weight-scaled MET-min/week score (metOf, rowMet, metMinOf,
   bwKg, MET_TARGET, MET_FLOOR, BW_DEFAULT) because it was a population target
   sitting next to a personal one, estimated three layers deep. v63 then deleted
   speedMet, its last remaining caller (the incline ladder), as dead code.
   v65 brings both back, reshaped: no body weight anywhere, because MET is
   already energy cost PER KG by definition — every equation below outputs the
   right units on its own — and the number is now one of three views on the
   same weekly total (see aeroTotals/aeroProgHTML), not a target to hit. */
function x4Sets(e){ const n=num(e.sets); return (n==null||n<=0)?4:Math.max(1,Math.min(8,Math.round(n))); }
function x4Parts(e){ const n=x4Sets(e); return {work:n*X4.work, easy:X4.warm+X4.cool+Math.max(0,n-1)*X4.rest}; }
/* total time the session occupies — for the 4×4 this is derived from the rounds,
   which is why it has no Time field to disagree with */
function aeroMinOf(e){
  if(e.t==='x4'){ const p=x4Parts(e); return p.work+p.easy; }
  const v=num(e.min); return v==null?0:v;
}
/* v54's equation picker, back for METs·mins: ACSM walking below 7 km/h, running
   from 7 up, so the same speed never means two different things depending on
   which card logged it. Used by Incline walk directly and by Run once its
   split gives up a speed (see metMinOf). */
function speedMet(kmh, grade){
  if(kmh==null||kmh<=0) return null;
  const S=kmh*16.6667, G=(grade||0)/100;
  const vo2 = kmh<7 ? (0.1*S + 1.8*S*G + 3.5)     /* ACSM walking */
                    : (0.2*S + 0.9*S*G + 3.5);    /* ACSM running */
  return Math.round(vo2/3.5*10)/10;
}
/* Row has no speed field — only a split, derived from time and distance — so
   its MET comes from estimated power instead. The Concept2 pace→watts formula
   turns that split into watts with no extra input (not the watts shown on the
   erg screen, which the user need not transcribe), and the Compendium of
   Physical Activities' rowing-ergometer codes (2011: 02130–02150, watts→MET)
   are linearly interpolated between their four points, anchored at (0 W, 1
   MET) for a stalled or barely-moving stroke. */
const ROW_MET_TABLE=[[0,1],[50,3.5],[100,7.0],[150,8.5],[200,12.0]];
function rowWatts(min,m){
  if(!min||!m||min<=0||m<=0) return 0;
  const secPer500=(min*60)/(m/500);
  return 2.8/Math.pow(secPer500/500,3);
}
function rowMet(min,m){
  const w=rowWatts(min,m); if(w<=0) return null;
  const T=ROW_MET_TABLE;
  for(let i=1;i<T.length;i++){
    if(w<=T[i][0]||i===T.length-1){
      const w0=T[i-1][0],m0=T[i-1][1],w1=T[i][0],m1=T[i][1];
      return Math.round((m0+(w-w0)*(m1-m0)/(w1-w0))*10)/10;
    }
  }
}
/* vertical climb, incline sessions only — the "% grade" a treadmill reports is
   already rise/run, so height = distance × grade% is exact, not an angle
   approximation. The 4×4's own incline is optional (see AERO) and, when given,
   only its WORK minutes count: the easy/rest minutes' incline is not tracked. */
function heightOf(e){
  const min=num(e.min), grade=num(e.grade);
  if(e.t==='incline'){
    const kmh=num(e.kmh);
    return (kmh==null||grade==null||min==null) ? 0 : kmh*min*grade/6;
  }
  if(e.t==='x4'){
    const kmh=num(e.kmh);
    if(kmh==null||grade==null) return 0;
    return kmh*x4Parts(e).work*grade/6;
  }
  return 0;
}
/* MET-minutes for one session. Run has no speed field, only time+distance, so
   its speed is derived the same way a pace would be. The 4×4 splits into its
   work and easy minutes (see x4Parts) and prices them separately: work at the
   logged speed (flat, i.e. MET 7, if no grade was given), easy minutes at a
   light-walk MET the way the warm-up/cooldown/rest actually feel. */
function metMinOf(e){
  const min=num(e.min);
  if(e.t==='incline'){
    const met=speedMet(num(e.kmh),num(e.grade));
    return (met==null||min==null) ? 0 : met*min;
  }
  if(e.t==='run'){
    const km=num(e.km);
    if(min==null||km==null||min<=0) return 0;
    const met=speedMet(km*60/min,0);
    return met==null ? 0 : met*min;
  }
  if(e.t==='row'){
    const met=rowMet(min,num(e.m));
    return (met==null||min==null) ? 0 : met*min;
  }
  if(e.t==='x4'){
    const p=x4Parts(e);
    const workMet=speedMet(num(e.kmh),num(e.grade))??7;
    return workMet*p.work + 3*p.easy;
  }
  return 0;
}
/* v36: nothing is pre-placed on the aerobic tab. The planned sessions live on

   v51: the empty AEROFIX list and the whole mirroring machinery it fed —
   aeroFixHTML, the [data-acheck] handler, the [data-mt] branch of the aerobic

/* ================= PURE ================= */
/* no DOM, no storage — extracted verbatim and unit-tested in node */
const p2 = n => String(n).padStart(2,'0');

/* wind the clock back ROLL_HOUR so 00:00–03:59 still belongs to the previous day */
function shifted(d){ const x=new Date(d.getTime()); x.setHours(x.getHours()-ROLL_HOUR); return x; }

function dayKeyOf(d){ const x=shifted(d); return `${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())}`; }
function monthKeyOf(d){ const x=shifted(d); return `${x.getFullYear()}-${p2(x.getMonth()+1)}`; }
/* v62 FIX: n months back, as a month KEY, without setMonth's clamp.
   `setMonth(getMonth()-1)` on the 31st does not land in the previous month — it
   lands in THIS one, because 31 Feb overflows forward to 3 Mar. Two callers
   depended on it: loadDaily (so on the 29th–31st the previous month's ticks were
   never read, and the 30-day density undercounted) and buildDump (so an export
   taken on the 31st walked 14 distinct months out of 24 and silently dropped the
   rest — a backup with holes in it). Anchor on day 1 and the arithmetic is exact
   for every month length. */
function monthKeyBack(d,n){
  const x=shifted(d);
  const t=new Date(x.getFullYear(), x.getMonth()-(n||0), 1);
  return `${t.getFullYear()}-${p2(t.getMonth()+1)}`;
}

/* ISO-8601 week. The week-YEAR can differ from the calendar year at both ends. */
function isoOf(d){
  const x=shifted(d); x.setHours(0,0,0,0);
  const t=new Date(x.getTime());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));          /* → Thursday of this week */
  const y=t.getFullYear();
  const jan4=new Date(y,0,4);
  const wk=1+Math.round(((t-jan4)/864e5-3+((jan4.getDay()+6)%7))/7);
  return {year:y,week:wk};
}
function weekKeyOf(d){ const {year,week}=isoOf(d); return `${year}-W${p2(week)}`; }

/* Monday of the (shifted) week, as YYYY-MM-DD */
function weekStartOf(d){
  const x=shifted(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return `${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())}`;
}
/* 0=Mon … 6=Sun */
function dowOf(d){ const x=shifted(d); return (x.getDay()+6)%7; }

/* a value that a user typed and might not have finished typing */
function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
/* speed/split maths — always DERIVED, never stored. Storing a number that can be
   computed from two others makes a third source of truth that can disagree. */
/* v60: speedOf, splitOf, fmtSpeed and fmtPace are gone. They were written for
   cardio items that lived in the week grid, which moved to the Aerobic tab in
   v53; aeroDerived — their last caller in that tab — went in v54; and metOf,
   the only thing still asking for a split, went with MET-min above. Nothing in
   the app has needed a speed or a pace string since. */
/* Freeze a week into an archive record.
   omitted id = skipped · {done:1} = did it, logged nothing
   {done:1,w} = strength weight · {done:1,m:{…}} = cardio metrics
   No item ever carries both: an exercise is measured in kg or in time/distance. */
function makeRecord(st, weekKey, endedDay){
  const items={};
  for(const id of Object.keys(st.checks||{})){
    if(!st.checks[id]) continue;
    const rec={done:1};
    const w=num((st.weights||{})[id]);
    if(w!=null) rec.w=w;
    const src=(st.metrics||{})[id];
    if(src){
      const m={};
      for(const k of Object.keys(src)){ const v=num(src[k]); if(v!=null) m[k]=v; }
      if(Object.keys(m).length) rec.m=m;
    }
    items[id]=rec;
  }
  const rec={week:weekKey, ended:endedDay, items};
  /* aerobic sessions: a list, not a map. An entry with no numbers at all was a
     row the user opened and never filled — it is not a session that happened. */
  const ae=[];
  for(const e of (st.aero||[])){
    const o={t:e.t,d:e.d}; let any=false;
    for(const k of ['min','km','m','kmh','grade','sets']){ const v=num(e[k]); if(v!=null){ o[k]=v; any=true; } }
    /* v54: the numbers test alone dropped the 4×4 at rollover. A 4×4 with no
       rounds typed carries no numbers at all, so `any` stayed false and the
       session was not archived — while the LIVE week counted it, because
       aeroCounts whitelists it. The identical week therefore read 40 min and
       368 MET-min on Sunday and 0 on Monday. Same whitelist, both sides. */
    if(any || AERO_NUMLESS[e.t]) ae.push(o);
  }
  if(ae.length) rec.aero=ae;
  const bw=num(st.bw);            /* one number a week, archived with the week */
  if(bw!=null) rec.bw=bw;
  if(st.deload) rec.dl=1;         /* so history can say why the week is bare */
  return rec;
}
/* ---- aerobic ----
   One flat list of sessions for a week, from either the live state or an
   archived record. The retired ids (s2, u2, w1) are read HERE and nowhere else:
   that is the entire migration, and it never rewrites what is already on disk.
   v54: the comment here used to say the 4×4 carries no minutes. It has since
   v53: aeroMinOf derives 40 minutes from its rounds, and those minutes count. */
function aeroList(src){
  const out=[];
  for(const e of (src.aero||[])) out.push(e);
  const I=src.items||{};
  for(const p of [['m2','run'],['s2','run'],['u2','run'],['w1','row']]){
    const m=I[p[0]]&&I[p[0]].m;
    if(m) out.push(Object.assign({t:p[1]},m));
  }
  if(I.f1) out.push(Object.assign({t:'x4'}, I.f1.m||{}));
  return out;
}
/* v50: the same test makeRecord applies at rollover, applied here too. Pressing
   "+ run" creates an empty row; counting it as a session meant the live week said
   "3 sessions" and the archived version of the identical week said "2", and the
   %-of-peak strip moved when nothing had been done. The 4×4 is the one deliberate
   exception — it carries no numbers because its duration is fixed by the
   protocol, so it is whitelisted rather than counted by accident. */
const AERO_NUMLESS={x4:1};
/* v55: > 0, not merely present. A row left at 0 minutes counted as a session,
   which mattered little for a bar and a lot for the ladder — a week of zeroes
   would have earned a rung. Zero of something is not some of it. */
function aeroCounts(e){
  if(AERO_NUMLESS[e.t]) return true;
  const pos=k=>{ const v=num(e[k]); return v!=null && v>0; };
  return pos('min')||pos('km')||pos('m');

function aeroTotals(list){
  let n=0,min=0,km=0,m=0,height=0,metMin=0;
  for(const e of list){
    if(!aeroCounts(e)) continue;
    n++;
    min+=aeroMinOf(e);
    const b=num(e.km);  if(b!=null) km+=b;
    const c=num(e.m);   if(c!=null) m+=c;
    height+=heightOf(e);
    metMin+=metMinOf(e);

/* the ceiling the 10%-per-week rule is measured against: the HIGHEST weekly
   total in the archive, not the most recent week. One easy week — or a
   deload — must not lower the bar the next week is compared to, otherwise the
   ratchet resets every time life gets in the way. Same reasoning for all three
   views the progress bar can show (see aeroProgHTML): each gets its own peak
   function and its own no-history fallback, since a minute, a metre of climb
   and a MET-minute are not remotely the same scale.
   No history at all → 35 minutes, a modest first-week denominator rather than
   the true target it took months to earn. v51 dropped the `def` flag that came
   with it: no caller ever read it, so the promise in this comment that the UI
   would say the denominator is an assumption was never kept. */
const AERO_BASE=35;
function aeroPeak(recs){
  let best=null;

    const min=aeroTotals(aeroList(r)).min;
    if(min>0 && (best==null || min>best.min)) best={min,week:r.week};
  }

}
const AERO_HEIGHT_BASE=90;
function aeroPeakHeight(recs){
  let best=null;
  for(const r of (recs||[])){
    const height=aeroTotals(aeroList(r)).height;
    if(height>0 && (best==null || height>best.height)) best={height,week:r.week};
  }
  return best || {height:AERO_HEIGHT_BASE,week:null};
}
const AERO_METMIN_BASE=200;
function aeroPeakMet(recs){
  let best=null;
  for(const r of (recs||[])){
    const metMin=aeroTotals(aeroList(r)).metMin;
    if(metMin>0 && (best==null || metMin>best.metMin)) best={metMin,week:r.week};
  }
  return best || {metMin:AERO_METMIN_BASE,week:null};
}
/* the number a history row is keyed on. 'w' = strength weight · 'm:min' = a metric */
function valOf(it,key){
  if(!it) return null;
  if(!key||key==='w') return it.w==null?null:it.w;
  const k=key.slice(2);
  return (it.m&&it.m[k]!=null)?it.m[k]:null;

/* merge without ever clobbering a week that is already archived */
function mergeWeek(shard, rec){
  const s=(shard&&shard.weeks)?shard:{v:1,weeks:{}};
  if(!s.weeks[rec.week]) s.weeks[rec.week]=rec;
  return s;
}
/* newest recorded value for an id · recs must be newest-first.
   key defaults to 'w', so every v20 caller keeps its old meaning. */
function lastRecorded(recs,id,key){
  for(const r of recs){
    const v=valOf((r.items||{})[id],key);
    if(v!=null) return {w:v,week:r.week};
  }
  return null;
}
/* history rows, newest first. delta compares to the previous week THAT HAS DATA */
function histRows(recs,id,limit,key){
  const out=[];
  for(const r of recs){
    const it=(r.items||{})[id];
    const v=valOf(it,key);
    if(!it)          out.push({week:r.week,skip:true,dl:!!r.dl});
    else if(v==null) out.push({week:r.week,done:true,m:it.m,dl:!!r.dl});
    else             out.push({week:r.week,w:v,m:it.m,dl:!!r.dl});
    if(out.length>=limit) break;
  }
  let prev=null;
  for(let i=out.length-1;i>=0;i--){
    const row=out[i];
    if(row.w==null) continue;
    row.delta = prev==null ? null : +(row.w-prev).toFixed(2);
    prev=row.w;
  }
  return out;
}
/* consecutive days ending today. today still unticked must not break the streak */
function streakOf(days,id,nowD){
  let n=0, d=new Date(nowD.getTime());
  if(!(days[dayKeyOf(d)]||{})[id]) d.setDate(d.getDate()-1);
  while((days[dayKeyOf(d)]||{})[id]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function densityOf(days,id,nowD,span){
  let n=0;
  for(let i=0;i<span;i++){ const x=new Date(nowD.getTime()); x.setDate(x.getDate()-i); if((days[dayKeyOf(x)]||{})[id]) n++; }
  return n;
}

/* ================= perf (v20) =================
   Boot is latency-bound, not CPU-bound: every store.get is a round trip to the
   host. Measure it rather than guess. `window.__perf()` prints the ledger. */
const perf={t0:(typeof performance!=='undefined'?performance.now():0),ops:[],marks:[],
  mark(label){ perf.marks.push({label,at:Math.round(perf.el())}); },
  el(){ return (typeof performance!=='undefined'?performance.now():0)-perf.t0; },
  dump(){
    const rows=perf.ops.map(o=>({op:o.op,key:o.key,ms:Math.round(o.ms),via:o.via}));
    /* eslint-disable no-console */
    console.log('%c[v28 boot]','font-weight:700', Math.round(perf.el())+'ms total');
    if(console.table) console.table(rows); else console.log(rows);
    console.log('marks',perf.marks);
    const bridge=rows.filter(r=>r.via==='fallback').length;
    if(bridge) console.warn(bridge+' op(s) fell back to localStorage — window.storage threw or is absent');
    return {total:Math.round(perf.el()),ops:rows,marks:perf.marks};
  }};
if(typeof window!=='undefined') window.__perf=()=>perf.dump();

/* ================= storage (async) ================= */
const store={
  has:()=>!!(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'),
  /* `st` is per-call, not shared: v20 runs reads in parallel, so a module-level
     flag would let one call's fallback mislabel another's. */
  async try(fn,fallback,st){
    st=st||{};
    if(store.has()){ try{ return await fn(window.storage); }catch(e){ st.fell=true; } }
    else st.fell=true;
    return fallback();
  },
  async get(k){
    const t=perf.el(), st={};
    const r=await store.try(s=>s.get(k,false),()=>{
      try{ const v=localStorage.getItem(k); return v==null?null:{key:k,value:v}; }catch(e){ return null; }
    },st);
    perf.ops.push({op:'get',key:k,ms:perf.el()-t,via:st.fell?'fallback':'bridge'});
    if(!r||r.value==null) return null;
    try{ return JSON.parse(r.value); }catch(e){ return null; }
  },
  async set(k,v){
    const t=perf.el(), st={};
    const s=JSON.stringify(v);
    const r=await store.try(x=>x.set(k,s,false),()=>{
      try{ localStorage.setItem(k,s); return {key:k,value:s}; }catch(e){ return null; }
    },st);
    perf.ops.push({op:'set',key:k,ms:perf.el()-t,via:st.fell?'fallback':'bridge'});
    return !!r;
  },
  /* --- sync localStorage mirror, for tiny UI-only values on the critical path.
     Never the source of truth: store.set still writes the real backend. When
     window.storage is absent the fallback writes the same key with the same
     JSON, so the two can never disagree. --- */
  mirrorGet(k){
    try{ const v=localStorage.getItem(k); return v==null?null:JSON.parse(v); }catch(e){ return null; }
  },
  mirrorSet(k,v){
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

/* ================= state ================= */
const now = () => new Date();
let state    = {weekStart:weekStartOf(now()),checks:{},weights:{},metrics:{},aero:[],bw:'',deload:false,stopped:{}};
let histRecs = [];     /* newest first */
let dayLog   = {};     /* dayKey → {x3:1,…} */
let histOK   = true;   /* false ⇒ the shard rollover would write into failed to read */
let histGaps = [];     /* years the index promised that did not come back */

/* applyState is separate from the read so init can fetch KEY in parallel with
   HIDX and still funnel through one place. */
/* v62 FIX: validate, do not merely default.
   `s.checks || {}` catches null and nothing else. Import accepts arbitrary JSON
   off the clipboard, so a hand-edited or truncated dump could set weights to a
   STRING — after which `state.weights[id]=v` is a silent no-op in sloppy mode and
   every weight typed for the rest of the session vanished with no error — or put
   a null in the aero list, which crashed the whole Aerobic tab in the sort. Each
   field is now checked for the shape the rest of the app assumes it has. */
const plainObj = v => (v && typeof v==='object' && !Array.isArray(v)) ? v : {};
function applyState(s){
  if(s&&typeof s==='object'){
    state={
      weekStart : (typeof s.weekStart==='string' && s.weekStart) ? s.weekStart : weekStartOf(now()),
      checks    : plainObj(s.checks),
      weights   : plainObj(s.weights),
      metrics   : plainObj(s.metrics),
      /* an entry needs a session id and a type to be renderable or countable */
      aero      : (Array.isArray(s.aero)?s.aero:[]).filter(e=>e&&typeof e==='object'&&e.t),
      bw        : (typeof s.bw==='number'||typeof s.bw==='string') ? s.bw : '',
      deload    : !!s.deload,
      stopped   : plainObj(s.stopped)
    };
  }
}
async function loadState(){ applyState(await store.get(KEY)); }

/* idxPre: a pre-fetched HIDX, so init can read it in the same wave as KEY.
   Pass nothing and it fetches its own (rollIfStale still does). */
async function loadHist(idxPre){
  histOK=true;
  const idx = (idxPre===undefined) ? await store.get(HIDX) : idxPre;
  /* v62 FIX: normalise to numbers and dedupe.
     `['2026', 2026]` — which an import could produce, because the index was
     written with a default lexicographic sort over a Set that treats the string
     and the number as different members — mapped to the SAME shard key. The
     shard was fetched twice, every week in it entered histRecs twice, and the
     damage was not cosmetic: the history table repeated a week with a delta of
     0, and phaseEarned() counted each incline week twice, walking the ladder up
     at double speed. */
  const rawYears=(idx&&Array.isArray(idx.years))?idx.years:[];
  const years=[...new Set(rawYears.map(Number).filter(y=>Number.isFinite(y)))];
  /* newest year first, stop once there is enough to fill the 8-row table and the
     anchor. NOT a fixed 2-year window: after a long break the last recorded weight
     may be several years old and must still surface.
     v20: the shards are fetched in one parallel wave instead of a serial chain,
     but they are CONSUMED in the old order and the old break condition still
     applies — a shard past the break is never inspected, so it can never flip
     histOK and block a rollover that v19 would have allowed. */
  const want=years.sort((a,b)=>b-a).slice(0,5);
  /* the year the next rollover would archive into */
  const guardYear=Number(weekKeyOf(new Date((state&&state.weekStart?state.weekStart:weekStartOf(now()))+'T12:00:00')).slice(0,4));
  histGaps=[];
  const shards=await Promise.all(want.map(y=>store.get(HSHARD(y))));
  const recs=[];
  for(let i=0;i<want.length;i++){
    if(recs.length>=12) break;
    const sh=shards[i];
    /* v49: a missing shard used to set histOK=false whatever year it was, and
       histOK=false blocks rollIfStale forever — so one unreadable 2024 shard
       could silently freeze the current week open indefinitely, with the next
       tick landing in a week that should already have been archived.
       Only the year the rollover would WRITE into is worth failing closed for;
       an older gap just means the history table is short, and mergeWeek already
       refuses to overwrite a week that is on disk. The gap is recorded so the
       UI can say it out loud instead of the table quietly being wrong. */
    if(!sh||!sh.weeks){
      histGaps.push(want[i]);
      if(want[i]===guardYear) histOK=false;
      continue;
    }
    for(const k of Object.keys(sh.weeks)) recs.push(sh.weeks[k]);
  }
  recs.sort((a,b)=> a.week<b.week?1:(a.week>b.week?-1:0));
  /* v62: one record per week key, whatever the shards contained. The year dedupe
     above is the fix; this is the invariant, held where every reader can rely on
     it — histRows and aeroPeak both assume weeks are unique. */
  const seen=new Set();
  histRecs=recs.filter(r=>{ if(!r||!r.week||seen.has(r.week)) return false; seen.add(r.week); return true; });
}
async function loadDaily(){
  const d=now();
  const out={};
  /* v62 FIX: monthKeyBack, not setMonth — see the note on monthKeyBack. The two
     keys must also be DISTINCT, or one shard is fetched twice and the other not
     at all, which is exactly what happened on the 31st. */
  const mks=[...new Set([monthKeyBack(d,1),monthKeyOf(d)])];
  const shards=await Promise.all(mks.map(mk=>store.get(DSHARD(mk))));   /* v20: one wave */
  for(const sh of shards){ if(sh&&sh.days) Object.assign(out,sh.days); }
  dayLog=out;
}
/* v50: read-modify-write, one shard, fire-and-forget callers. Two taps inside
   one round trip both read the same pre-tap shard and the second write erased the
   first. The fix is a per-shard promise chain: writes to the same month queue
   behind each other, so every read sees the previous write. Different months
   still run in parallel — they cannot collide.
   The chain is also COALESCED: dayLog is already the source of truth in memory,
   so five queued writes to one month would each persist the same final object.
   One pending write per shard is enough, and it is scheduled to run after the
   in-flight one lands. */
const dailyChain={};   /* monthKey → {p: promise in flight, queued: bool} */
function saveDaily(dayKey){
  const mk=dayKey.slice(0,7);
  const slot=dailyChain[mk]||(dailyChain[mk]={p:Promise.resolve(),queued:false});
  if(slot.queued) return slot.p;        /* a write is already scheduled; it will see dayLog */
  slot.queued=true;
  slot.p=slot.p.then(async()=>{
    slot.queued=false;                  /* anything after this point needs its own write */
    const sh=(await store.get(DSHARD(mk)))||{v:1,days:{}};
    sh.days=sh.days||{};
    /* persist every day of this month from memory, not just dayKey: a coalesced
       write may be standing in for taps on more than one day. */
    for(const dk of Object.keys(dayLog)){
      if(dk.slice(0,7)!==mk) continue;
      const row=dayLog[dk];
      if(row&&Object.keys(row).length) sh.days[dk]=row; else delete sh.days[dk];
    }
    await store.set(DSHARD(mk),sh);
  }).catch(()=>{ slot.queued=false; });
  return slot.p;
}

/* ---- rollover: archive the stale week, then start clean ---- */
async function rollIfStale(){
  if(!histOK) return false;                              /* never write after a failed read */
  if(!isStale(state.weekStart,now())) return false;
  const prevKey=weekKeyOf(new Date(state.weekStart+'T12:00:00'));
  const rec=makeRecord(state,prevKey,dayKeyOf(now()));
  /* v49: rec.aero counts. A week whose only content was easy runs or rows —
     nothing ticked, nothing weighed — used to fail this test and be discarded,
     which also meant aeroPeak() could never see it and the 10%-per-week ceiling
     stayed permanently below what had actually been done. */
  if(Object.keys(rec.items).length||(rec.aero&&rec.aero.length)||rec.bw!=null||rec.dl){
    const y=Number(prevKey.slice(0,4));
    const sh=mergeWeek(await store.get(HSHARD(y)),rec);
    if(!(await store.set(HSHARD(y),sh))) return false;    /* write failed → keep week open */
    const idx=(await store.get(HIDX))||{years:[]};
    if(!Array.isArray(idx.years)) idx.years=[];
    if(!idx.years.includes(y)){ idx.years.push(y); await store.set(HIDX,idx); }
  }
  state={weekStart:weekStartOf(now()),checks:{},weights:{},metrics:{},aero:[],bw:'',deload:false,stopped:{}};
  await store.set(KEY,state);
  await loadHist();
  return true;
}

/* ================= save (debounced) ================= */
/* v51: the saving/saved indicator is gone with the #status element it wrote to —
   the element had not existed since the memo block was removed, so every write
   was already silent. */
let timer=null;
function save(){
  clearTimeout(timer);
  timer=setTimeout(()=>{ timer=null; store.set(KEY,state); },300);
}
/* v62 FIX: a real flush.
   v54 claimed to protect the last keystroke when the tab is backgrounded, and
   did not: the handler called save(), and save() STARTS a fresh 300ms timer. So
   backgrounding 100ms after typing replaced one pending write with another
   pending write, and iOS suspends timers the moment the app leaves the screen.
   It also only looked at aeroTimer — the weight/body-weight timer and every
   habit-field timer were never touched at all.
   flushWrites issues the writes immediately instead of rescheduling them.
   Declared here but it also reaches habTimers/aeroTimer, which are defined
   further down; it is only ever CALLED from an event, long after parse. */
function flushWrites(){
  if(timer){ clearTimeout(timer); timer=null; store.set(KEY,state); }
  if(typeof aeroTimer!=='undefined' && aeroTimer){ clearTimeout(aeroTimer); aeroTimer=null; store.set(KEY,state); }
  if(typeof habTimers!=='undefined'){
    for(const k of Object.keys(habTimers)){
      const t=habTimers[k]; if(!t) continue;
      clearTimeout(t); delete habTimers[k];
      const fn=habFlush[k]; if(fn) fn();     /* run the write the timer was holding */
    }
  }
}
